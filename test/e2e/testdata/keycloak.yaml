# A single Keycloak realm for the flows of the suite that authenticate against
# an identity provider they do not run themselves. It serves one confidential
# client for both the browser login and the machine callers, the clients of a
# management plane in the oidc mode, and one static user. The data lives in
# the development-mode in-memory database: the server exists for one suite
# run.
#
# The realm export holds the client secrets and the password of the user, so
# it is a Secret and not a ConfigMap, as the PostgreSQL fixture of the suite
# already does with its credentials.
#
# The user carries a first and a last name. Keycloak requires both of every
# user, and it asks a user who has neither to complete the profile at the first
# login. That form stands between the credentials and the callback, so the
# browser login of the suite never reaches the application without the two
# names.
#
# The "camunda" client carries two protocol mappers, and the CamundaCluster
# flow does not work without either one. The audience mapper puts the client
# id in "aud", because Keycloak otherwise issues "aud": "account" and the
# Camunda audiences check refuses the token.
#
# The second mapper puts "client_id" in the access token of a service account,
# because a Keycloak token names its client in "azp", and "azp" is present in
# the token of a person as well. It is the built-in "Client ID" mapper of
# Keycloak: it copies the "clientId" note of the session, which Keycloak sets
# on a client-credentials session and on no other. The token of a person
# therefore carries no "client_id", which is what the orchestration cluster
# needs to read a browser login as the person rather than as the client
# (https://docs.camunda.io/docs/self-managed/components/orchestration-cluster/admin/connect-external-identity-provider/#how-principal-identification-works).
#
# The four "management-" clients are the ones a CamundaManagementCluster in
# the oidc mode names in spec.auth.oidc.management.clients. Management
# Identity creates no client in that mode, so the realm has to hold them
# already. Every confidential one takes the same secret, so a single Secret of
# the namespace serves all of them.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-realm
type: Opaque
stringData:
  realm.json: |
    {
      "realm": "camunda",
      "enabled": true,
      "sslRequired": "none",
      "accessTokenLifespan": 1800,
      "clients": [
        {
          "clientId": "camunda",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "camunda-e2e-secret",
          "standardFlowEnabled": true,
          "serviceAccountsEnabled": true,
          "directAccessGrantsEnabled": true,
          "redirectUris": ["*"],
          "webOrigins": ["*"],
          "protocolMappers": [
            {
              "name": "camunda-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "camunda",
                "access.token.claim": "true",
                "id.token.claim": "false"
              }
            },
            {
              "name": "camunda-client-id",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usersessionmodel-note-mapper",
              "config": {
                "user.session.note": "clientId",
                "claim.name": "client_id",
                "jsonType.label": "String",
                "access.token.claim": "true",
                "id.token.claim": "false",
                "userinfo.token.claim": "false"
              }
            }
          ]
        },
        {
          "clientId": "management-identity",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "camunda-e2e-secret",
          "standardFlowEnabled": true,
          "serviceAccountsEnabled": true,
          "directAccessGrantsEnabled": true,
          "redirectUris": ["*"],
          "webOrigins": ["*"],
          "protocolMappers": [
            {
              "name": "management-identity-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "management-identity",
                "access.token.claim": "true",
                "id.token.claim": "false"
              }
            }
          ]
        },
        {
          "clientId": "management-optimize",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "camunda-e2e-secret",
          "standardFlowEnabled": true,
          "serviceAccountsEnabled": true,
          "redirectUris": ["*"],
          "webOrigins": ["*"],
          "protocolMappers": [
            {
              "name": "management-optimize-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "management-optimize",
                "access.token.claim": "true",
                "id.token.claim": "false"
              }
            }
          ]
        },
        {
          "clientId": "management-web-modeler",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "standardFlowEnabled": true,
          "redirectUris": ["*"],
          "webOrigins": ["*"]
        },
        {
          "clientId": "management-web-modeler-api",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "camunda-e2e-secret",
          "standardFlowEnabled": true,
          "serviceAccountsEnabled": true,
          "redirectUris": ["*"],
          "webOrigins": ["*"],
          "protocolMappers": [
            {
              "name": "management-web-modeler-api-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "management-web-modeler-api",
                "access.token.claim": "true",
                "id.token.claim": "false"
              }
            }
          ]
        }
      ],
      "users": [
        {
          "username": "ada@example.com",
          "email": "ada@example.com",
          "emailVerified": true,
          "firstName": "Ada",
          "lastName": "Lovelace",
          "enabled": true,
          "credentials": [
            {
              "type": "password",
              "value": "ada-e2e-password",
              "temporary": false
            }
          ]
        }
      ]
    }
---
# The password of that user, for the helper pod that completes the browser
# login. The pod reads it through secretKeyRef, so the password never stands in
# a pod spec. It repeats the value of the realm export above, and the login
# fails when the two stop agreeing.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-user
type: Opaque
stringData:
  password: ada-e2e-password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          # renovate: datasource=docker depName=quay.io/keycloak/keycloak
          image: quay.io/keycloak/keycloak:26.7.3
          args: ["start-dev", "--import-realm"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: keycloak-e2e-password
          # The discovery document of the realm proves that the import
          # finished, which a liveness endpoint would not.
          readinessProbe:
            httpGet:
              path: /realms/camunda/.well-known/openid-configuration
              port: http
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          secret:
            secretName: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: http
