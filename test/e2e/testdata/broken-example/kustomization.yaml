# The camunda-cluster/elasticsearch inventory with one reference broken: the
# storageRef of the CamundaCluster names a SecondaryStorageConfig that nothing
# publishes. Everything else is the inventory as it ships, the
# ElasticsearchCluster that publishes my-storage-config included.
#
# The example flow of the e2e suite applies this overlay and waits for the
# CamundaCluster to report Ready=False InvalidReference. That is the answer the
# Ready wait of every other spec of the flow would time out on, so the flow
# fails when an inventory carries a dangling reference.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../../config/example/camunda-cluster/elasticsearch
patches:
- target:
    group: core.camunda.io
    version: v1
    kind: CamundaCluster
    name: my-cluster
  patch: |
    - op: replace
      path: /spec/storageRef
      value: no-such-storage
