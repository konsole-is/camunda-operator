site_name: Camunda Operator
site_description: Core Kubernetes operator for the Camunda platform
site_url: https://konsole-is.github.io/camunda-operator/
repo_url: https://github.com/konsole-is/camunda-operator
repo_name: konsole-is/camunda-operator
edit_uri: edit/main/docs/

# docs/superpowers/ is internal working material and never published.
exclude_docs: |
  superpowers/
  crds/TEMPLATE.md

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

plugins:
  - search
  # Pan and zoom on every mermaid diagram: hold Alt and scroll, or use the
  # buttons under the diagram. The plugin ships its own JavaScript.
  - panzoom:
      full_screen: true
      always_show_hint: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Installation: installation.md
  - Use the API types from Go: go-api.md
  - Architecture: architecture.md
  - Guides:
      - Presets: guides/presets.md
      - Secondary storage: guides/secondary-storage.md
      - Authentication: guides/authentication.md
      - Backup: guides/backup.md
      - Operations: guides/operations.md
  - CRD reference:
      - Overview: crds/index.md
      - Cluster:
          - CamundaCluster: crds/camundacluster.md
          - CamundaPlatformConfig: crds/camundaplatformconfig.md
          - CamundaClusterPreset: crds/camundaclusterpreset.md
      - Storage backends:
          - ElasticsearchCluster: crds/elasticsearchcluster.md
          - ElasticsearchClusterPreset: crds/elasticsearchclusterpreset.md
          - Database: crds/database.md
      - Contracts:
          - SecondaryStorageConfig: crds/secondarystorageconfig.md
          - ObjectStorageConfig: crds/objectstorageconfig.md
          - DatabaseServerConfig: crds/databaseserverconfig.md
          - DatabaseConfig: crds/databaseconfig.md
          - ManagementAuthConfig: crds/managementauthconfig.md
      - Backup:
          - LogicalBackupElasticsearch: crds/logicalbackupelasticsearch.md
          - LogicalBackupRDBMS: crds/logicalbackuprdbms.md
      - Restore:
          - LogicalRestoreElasticsearch: crds/logicalrestoreelasticsearch.md
          - PointInTimeRestore: crds/pointintimerestore.md
      - Planned:
          - BackupSchedule: crds/backupschedule.md
          - CamundaOptimize: crds/camundaoptimize.md
          - CamundaManagementCluster: crds/camundamanagementcluster.md
          - PVCAutoResize: crds/pvcautoresize.md
