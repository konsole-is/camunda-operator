version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    # prealloc is off. It asks to size a slice literal before an append, and only a profile can show that this matters.
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - logcheck
  settings:
    custom:
      logcheck:
        type: "module"
        description: Checks Go logging calls for Kubernetes logging conventions.
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    goconst:
      # A test reads best with its expected values written out, not as constants.
      ignore-tests: true
      # Call is the default. A table of data, such as RBAC rules or a JSON body, reads best with its values written out.
      exclude-types:
        - Call
        - CompositeLit
    modernize:
      disable:
        - omitzero
        # One declared target serves several errors.As checks and switch cases. errors.AsType needs a new one at each.
        - errorsastype
        # The ObjectMeta of a Kubernetes object stays named in a literal, not set through promoted fields.
        - embedlit
        # Under Go 1.27 it asks for strings.CutLast, which Go 1.26 cannot compile.
        - stringscut
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      # The ocf-generated wrapper packages carry long doc-comment lines and no
      # generated-code header; regenerating them must stay lint-clean.
      - linters:
          - lll
        path: pkg/wrappers/*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
    - golines
  settings:
    golines:
      # This matches the lll limit, so the formatter never leaves a line that the linter rejects.
      max-len: 120
      tab-len: 4
      # Comments are prose, not code. A rewrap mangles markers and doc links.
      shorten-comments: false
      # A long chain breaks at the dots. Otherwise the arguments of the last
      # call are nested, which makes Gomega assertions hard to read.
      chain-split-dots: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
