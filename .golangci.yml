version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - logcheck
  settings:
    custom:
      logcheck:
        type: "module"
        description: Checks Go logging calls for Kubernetes logging conventions.
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      # The ocf-generated wrapper packages carry long doc-comment lines and no
      # generated-code header; regenerating them must stay lint-clean.
      - linters:
          - lll
        path: pkg/wrappers/*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
    - golines
  settings:
    golines:
      # This matches the lll limit, so the formatter never leaves a line that the linter rejects.
      max-len: 120
      tab-len: 4
      # Comments are prose, not code. A rewrap mangles markers and doc links.
      shorten-comments: false
      # A long chain breaks at the dots. Otherwise the arguments of the last
      # call are nested, which makes Gomega assertions hard to read.
      chain-split-dots: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
