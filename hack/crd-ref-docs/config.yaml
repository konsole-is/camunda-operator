# Configuration of crd-ref-docs for `make api-docs`, which renders
# docs/crds/api-reference.md from the types in api/v1. make api-docs appends
# render.kubernetesVersion, the minor of k8s.io/api in go.mod, so the links to
# Kubernetes types follow a bump of k8s.io/api.
processor:
  ignoreTypes:
    - "List$"
  ignoreFields:
    - "TypeMeta$"
