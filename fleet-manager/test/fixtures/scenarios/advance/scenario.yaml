# Written by hand for test/k8s/scenarios.test.ts, in the format of the
# generated page scenarios.
schemaVersion: 1
description: >-
  A Deployment with a ReplicaSet, a ConfigMap with a finalizer, a Pod on a
  node, a ConfigMap that names the UID of a ConfigMap of the state moved,
  and a second Namespace. The state moved scales the Deployment, drops the
  status of the ReplicaSet, removes the ConfigMap, the Pod, and the
  Namespace, and adds a ConfigMap.
states:
  - name: moved
    description: >-
      The Deployment has 2 replicas and the ReplicaSet has no status. The
      ConfigMap gone, the Pod gone-pod, and the Namespace advance-gone are
      deleted, and the ConfigMap new is added.
