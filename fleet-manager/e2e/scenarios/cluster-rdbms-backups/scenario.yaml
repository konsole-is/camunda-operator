schemaVersion: 1
description: >-
  A managed CamundaCluster on PostgreSQL with backup storage. It is the
  cluster of cluster-es-backups, with an rdbms SecondaryStorageConfig whose
  DatabaseConfig names the DatabaseServerConfig postgres. That config has
  pitr.recovery external, so the admin rolls the database server back before
  a point-in-time restore. The Database camundacluster-sample-db created the
  DatabaseConfig and is the only Database on the server. No DatabaseServer
  publishes the server, and envtest reaches no database and no bucket, so
  the server publishes no identity and the cluster takes no backup.
seed:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: team-a
  - apiVersion: v1
    kind: Secret
    metadata:
      name: oidc-credentials
      namespace: camunda-system
    stringData:
      client-secret: scenario
  - apiVersion: v1
    kind: Secret
    metadata:
      name: camunda-license
      namespace: camunda-system
    stringData:
      license-key: scenario
  - apiVersion: core.camunda.io/v1
    kind: CamundaPlatformConfig
    metadata:
      labels:
        app.kubernetes.io/name: camunda-operator
        app.kubernetes.io/managed-by: kustomize
      name: camundaplatformconfig-sample
    spec:
      auth:
        method: oidc
        oidc:
          issuerUrl: "https://login.example.com/realms/camunda"
          clientId: "camunda-orchestration"
          audience: "camunda-orchestration"
          clientSecretRef:
            name: "oidc-credentials"
            namespace: "camunda-system"
            key: "client-secret"
      licenseSecretRef:
        name: "camunda-license"
        namespace: "camunda-system"
        key: "license-key"
      images:
        camunda: "registry.example.com/camunda/camunda"
        optimize: "registry.example.com/camunda/optimize"
  - apiVersion: core.camunda.io/v1
    kind: CamundaClusterPreset
    metadata:
      labels:
        app.kubernetes.io/name: camunda-operator
        app.kubernetes.io/managed-by: kustomize
      name: medium
    spec:
      cluster:
        podLabels:
          company.com/team: "automation-ops"
        podAnnotations:
          company.com/cluster-preset: "medium"
        zeebe:
          replicas: 3
          partitions: 3
          replicationFactor: 3
          resources:
            requests: { cpu: "1", memory: "2Gi" }
            limits: { cpu: "2", memory: "4Gi" }
          storageClassName: "ssd"
          storageSize: "32Gi"
          extraEnv:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+ExitOnOutOfMemoryError -Xmx1g"
        gateway:
          mode: Standalone
          replicas: 2
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
        operate:
          mode: Embedded
        tasklist:
          mode: Embedded
        admin:
          mode: Embedded
        connectors:
          enabled: true
          replicas: 1
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
  - apiVersion: core.camunda.io/v1
    kind: CamundaRelease
    metadata:
      labels:
        app.kubernetes.io/name: camunda-operator
        app.kubernetes.io/managed-by: kustomize
      name: camunda-8-9-0
    spec:
      version: "8.9.0"
      connectors:
        version: "8.9.7"
      elasticsearch:
        version: "9.2.4"
      databaseServer:
        version: "17"
      extraEnv:
        - name: CAMUNDA_FEATURE_FLAG
          value: "true"
  - apiVersion: v1
    kind: Secret
    metadata:
      name: camundacluster-sample-storage-credentials
      namespace: team-a
    stringData:
      username: camunda
      password: scenario
  - apiVersion: core.camunda.io/v1
    kind: SecondaryStorageConfig
    metadata:
      labels:
        app.kubernetes.io/name: camunda-operator
        app.kubernetes.io/managed-by: kustomize
      name: camundacluster-sample-storage
      namespace: team-a
    spec:
      type: rdbms
      rdbms:
        databaseConfigRef: camundacluster-sample-db
  - apiVersion: core.camunda.io/v1
    kind: Database
    metadata:
      name: camundacluster-sample-db
      namespace: team-a
    spec:
      serverRef: postgres
      databaseName: camunda
  # The Database never reaches the server, so the seed writes the
  # DatabaseConfig that it would publish. envtest runs no garbage collector,
  # so the made-up uid of the owner reference stays.
  - apiVersion: core.camunda.io/v1
    kind: DatabaseConfig
    metadata:
      name: camundacluster-sample-db
      namespace: team-a
      ownerReferences:
        - apiVersion: core.camunda.io/v1
          kind: Database
          name: camundacluster-sample-db
          uid: 00000000-0000-0000-0000-000000000001
          controller: true
    spec:
      serverRef: postgres
      databaseName: camunda
      credentialsSecretRef:
        name: camundacluster-sample-storage-credentials
        usernameKey: username
        passwordKey: password
  - apiVersion: v1
    kind: Secret
    metadata:
      name: postgres-admin
      namespace: team-a
    stringData:
      username: postgres
      password: scenario
  - apiVersion: core.camunda.io/v1
    kind: DatabaseServerConfig
    metadata:
      name: postgres
      namespace: team-a
    spec:
      engine: postgres
      # The generator probes the server. A host name fails with the text of
      # the local resolver, which differs between machines. Nothing listens
      # on port 1, so this probe fails with the same text everywhere.
      host: 127.0.0.1
      port: 1
      adminCredentialsSecretRef:
        name: postgres-admin
        usernameKey: username
        passwordKey: password
      pitr:
        enabled: true
        retentionPeriodDays: 3
        recovery: external
  - apiVersion: core.camunda.io/v1
    kind: CamundaCluster
    metadata:
      labels:
        app.kubernetes.io/name: camunda-operator
        app.kubernetes.io/managed-by: kustomize
        fleet.camunda.io/claim: camundacluster-sample
      name: camundacluster-sample
      namespace: team-a
    spec:
      backupStorageRef: backups
      platformConfigRef: camundaplatformconfig-sample
      presetRef: medium
      releaseRef: camunda-8-9-0
      externalUrl: "https://my-cluster.camunda.example.com"
      serviceAccount:
        annotations:
          eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/my-cluster-role"
      zeebe:
        replicas: 5
        resources:
          requests:
            memory: "8Gi"
          limits:
            memory: "8Gi"
        extraEnv:
          - name: JAVA_TOOL_OPTIONS
            value: "-XX:+ExitOnOutOfMemoryError -Xmx2g"
      connectors:
        enabled: true
      storageRef: camundacluster-sample-storage
      suspend: false
  - apiVersion: core.camunda.io/v1
    kind: ObjectStorageConfig
    metadata:
      name: backups
      namespace: team-a
    spec:
      type: S3
      s3:
        bucketName: acme-backups
        region: eu-west-1
        auth:
          type: workloadIdentity
          workloadIdentity:
            roleArn: "arn:aws:iam::123456789012:role/backups-role"
