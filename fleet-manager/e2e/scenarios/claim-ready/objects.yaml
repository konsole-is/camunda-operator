  name: management-database-server
  uid: 7eed5b65-4c02-56a9-8557-7a8c540b63ce
spec:
  controller:
    name: camunda-operator
    version: 0.0.0-dev
  deletionPolicies:
  - Delete
  - Orphan
  description: Runs a PostgreSQL server with one database for each component of the
    management plane.
  inputs:
  - from: volume-encryption/storageClassName
    name: storageClassName
  label: New PostgreSQL server
  mode: Default
  outputs:
  - description: The name of the DatabaseConfig of Keycloak.
    key: keycloakDatabaseConfig
  - description: The name of the DatabaseConfig of Management Identity.
    key: identityDatabaseConfig
  - description: The name of the DatabaseConfig of Web Modeler.
    key: webModelerDatabaseConfig
  parameters:
    properties:
      databases:
        description: The components that get a database. The management plane claim
          sets it.
        items:
          enum:
          - keycloak
          - identity
          - webModeler
          type: string
        title: Databases
        type: array
      preset:
        description: The name of the DatabaseServerPreset that the PostgreSQL server
          starts from.
        minLength: 1
        title: Preset
        type: string
      version:
        default: "17"
