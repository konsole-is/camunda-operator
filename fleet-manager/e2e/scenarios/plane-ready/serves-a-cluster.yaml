  description: Runs a PostgreSQL server and a database for the cluster, from a database
    server preset.
  inputs:
  - from: volume-encryption/storageClassName
    name: storageClassName
  - from: backup-storage/objectStorageConfig
    name: objectStorageConfig
  - from: cloud-identity/serviceAccountAnnotations
    name: serviceAccountAnnotations
  label: New PostgreSQL server
  mode: Optional
  outputs:
  - description: The name of the SecondaryStorageConfig that the cluster reads.
    key: secondaryStorageConfig
  parameters:
    properties:
      overrides:
        description: The values that replace the values of the preset.
        properties:
          instances:
            description: The number of PostgreSQL instances.
            format: int32
            minimum: 1
            type: integer
          podLabels:
            additionalProperties:
              type: string
            description: The labels to add to the PostgreSQL pods.
            type: object
          resources:
            description: The CPU and memory of each instance, as spec.resources of
              a DatabaseServer.
            type: object
            x-kubernetes-preserve-unknown-fields: true
          scheduling:
            description: Where the instances run, as spec.scheduling of a DatabaseServer.
            type: object
            x-kubernetes-preserve-unknown-fields: true
          storageSize:
            description: The volume size of each instance, for example 20Gi. The size
              only grows.
            type: string
        title: Overrides
        type: object
      preset:
        description: The name of the DatabaseServerPreset that the PostgreSQL server
          starts from.
        minLength: 1
        title: Preset
        type: string
      releaseRef:
        description: The name of the CamundaRelease that gives the PostgreSQL major
          version. The claim controller sets it to the release of the claim.
        minLength: 1
        title: Release
        type: string
    required:
    - preset
    - releaseRef
    type: object
  sections:
  - secondary-storage
  serviceAccount:
