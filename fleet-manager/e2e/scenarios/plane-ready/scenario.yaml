schemaVersion: 1
description: >-
  A CamundaManagementCluster in OIDC mode with Console, made from the
  CamundaManagementClusterClaim plane-a in the Environment Platform. The
  claim selects the built-in option for existing DatabaseConfigs. The OIDC
  platform config and its Secrets are those of claim-ready, under the name
  oidc-platform. It adds the auth, token, and JWKS URLs and the clients of
  Management Identity, Optimize, and Console, with the Secrets of the
  confidential clients, because a plane in OIDC mode needs them. The
  DatabaseServerConfig and the DatabaseConfig identity-db are those of
  plane-create. The plane runs no Web Modeler: the pods of Web Modeler roll
  on the UID of the pusher Secret that the operator generates, and envtest
  gives that Secret a new UID on each run. The Environment has no access
  section, so the claim types its URLs.
seed:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: platform
      labels:
        fleet.camunda.io/environment: platform
  - apiVersion: v1
    kind: Secret
    metadata:
      name: oidc-credentials
      namespace: camunda-system
    stringData:
      client-secret: scenario
  - apiVersion: v1
    kind: Secret
    metadata:
      name: camunda-license
      namespace: camunda-system
    stringData:
      license-key: scenario
  - apiVersion: v1
    kind: Secret
    metadata:
      name: management-identity-credentials
      namespace: camunda-system
    stringData:
      client-secret: scenario
  - apiVersion: v1
    kind: Secret
    metadata:
      name: optimize-credentials
      namespace: camunda-system
    stringData:
      client-secret: scenario
  - apiVersion: core.camunda.io/v1
    kind: CamundaPlatformConfig
    metadata:
      name: oidc-platform
    spec:
      auth:
        method: oidc
        oidc:
          issuerUrl: "https://login.example.com/realms/camunda"
          authUrl: "https://login.example.com/realms/camunda/protocol/openid-connect/auth"
          tokenUrl: "https://login.example.com/realms/camunda/protocol/openid-connect/token"
          jwksUrl: "https://login.example.com/realms/camunda/protocol/openid-connect/certs"
          clientId: "camunda-orchestration"
          audience: "camunda-orchestration"
          clientSecretRef:
            name: "oidc-credentials"
            namespace: "camunda-system"
            key: "client-secret"
          management:
            clients:
              identity:
                clientId: "management-identity"
                clientSecretRef:
                  name: "management-identity-credentials"
                  namespace: "camunda-system"
                  key: "client-secret"
              optimize:
                clientId: "optimize"
                clientSecretRef:
                  name: "optimize-credentials"
                  namespace: "camunda-system"
                  key: "client-secret"
              console:
                clientId: "console"
      licenseSecretRef:
        name: "camunda-license"
        namespace: "camunda-system"
        key: "license-key"
      images:
        camunda: "registry.example.com/camunda/camunda"
        optimize: "registry.example.com/camunda/optimize"
  - apiVersion: fleet.camunda.io/v1alpha1
    kind: Environment
    metadata:
      name: platform
    spec:
      displayName: Platform
      platformConfigRef: oidc-platform
      sections:
        management-database:
          required: true
          allowed: [existing-database-configs]
          default: existing-database-configs
      parameters:
        existing-database-configs:
          identity:
            claimEditable: true
  - apiVersion: v1
    kind: Secret
    metadata:
      name: postgres-admin
      namespace: platform
    stringData:
      username: postgres
      password: scenario
  - apiVersion: core.camunda.io/v1
    kind: DatabaseServerConfig
    metadata:
      name: postgres
      namespace: platform
    spec:
      engine: postgres
      # The generator probes the server. A host name fails with the text of
      # the local resolver, which differs between machines. Nothing listens
      # on port 1, so this probe fails with the same text everywhere.
      host: 127.0.0.1
      port: 1
      adminCredentialsSecretRef:
        name: postgres-admin
        usernameKey: username
        passwordKey: password
  - apiVersion: v1
    kind: Secret
    metadata:
      name: identity-db
      namespace: platform
    stringData:
      username: identity
      password: scenario
  - apiVersion: core.camunda.io/v1
    kind: DatabaseConfig
    metadata:
      name: identity-db
      namespace: platform
    spec:
      serverRef: postgres
      databaseName: identity
      credentialsSecretRef:
        name: identity-db
        usernameKey: username
        passwordKey: password
  - apiVersion: fleet.camunda.io/v1alpha1
    kind: CamundaManagementClusterClaim
    metadata:
      name: plane-a
      namespace: platform
    spec:
      environments: [platform]
      management:
        identityProvider:
          oidc: {}
        identity:
          externalUrl: https://management.example.com/identity
          admin:
            claimName: email
            claimValue: admin@example.com
        console:
          externalUrl: https://management.example.com/console
      versions:
        identity: "8.9.14"
        console: "8.9.133"
      plugins:
        - section: management-database
          registration: existing-database-configs
          parameters:
            identity: identity-db
