          instances:
            description: The number of PostgreSQL instances.
            format: int32
            minimum: 1
            type: integer
          podLabels:
            additionalProperties:
              type: string
            description: The labels to add to the PostgreSQL pods.
            type: object
          resources:
            description: The CPU and memory of each instance, as spec.resources of
              a DatabaseServer.
            type: object
            x-kubernetes-preserve-unknown-fields: true
          scheduling:
            description: Where the instances run, as spec.scheduling of a DatabaseServer.
            type: object
            x-kubernetes-preserve-unknown-fields: true
          storageSize:
            description: The volume size of each instance, for example 20Gi. The size
              only grows.
            type: string
        type: object
      preset:
        description: The name of the DatabaseServerPreset that the PostgreSQL server
          starts from.
        minLength: 1
        type: string
    required:
    - preset
    type: object
  sections:
  - secondary-storage
  serviceAccount:
    name: camunda-operator-controller-manager
    namespace: camunda-system
