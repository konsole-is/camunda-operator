# Written by hand. The page scenarios read it in place of the kubelet and
# metrics.k8s.io, which envtest does not have.
schemaVersion: 1
logs:
  - namespace: team-a
    pod: camundacluster-sample-zeebe-0
    lines:
      - "Broker 0 is ready"
      - "Partition 1 is healthy"
  - namespace: team-a
    pod: camundacluster-sample-zeebe-1
    lines:
      - "Broker 1 is ready"
usage:
  - namespace: team-a
    pod: camundacluster-sample-zeebe-0
    cpu: 250m
    memory: 1Gi
