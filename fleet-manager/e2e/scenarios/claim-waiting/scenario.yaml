schemaVersion: 1
description: >-
  The CamundaClusterClaim orders of claim-ready, without the Secret
  orders-storage-credentials and the SecondaryStorageConfig
  orders-storage. The claim names orders-storage, so its request waits
  for a SecondaryStorageConfig that does not exist, and the claim makes
  no CamundaCluster. The other objects are those of claim-ready.
seed:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: team-orders
      labels:
        fleet.camunda.io/environment: production
  - apiVersion: v1
    kind: Secret
    metadata:
      name: oidc-credentials
      namespace: camunda-system
    stringData:
      client-secret: scenario
  - apiVersion: v1
    kind: Secret
    metadata:
      name: camunda-license
      namespace: camunda-system
    stringData:
      license-key: scenario
  - apiVersion: core.camunda.io/v1
    kind: CamundaPlatformConfig
    metadata:
      labels:
        app.kubernetes.io/name: camunda-operator
        app.kubernetes.io/managed-by: kustomize
      name: camundaplatformconfig-sample
    spec:
      auth:
        method: oidc
        oidc:
          issuerUrl: "https://login.example.com/realms/camunda"
          clientId: "camunda-orchestration"
          audience: "camunda-orchestration"
          clientSecretRef:
            name: "oidc-credentials"
            namespace: "camunda-system"
            key: "client-secret"
      licenseSecretRef:
        name: "camunda-license"
        namespace: "camunda-system"
        key: "license-key"
      images:
        camunda: "registry.example.com/camunda/camunda"
        optimize: "registry.example.com/camunda/optimize"
  - apiVersion: core.camunda.io/v1
    kind: CamundaClusterPreset
    metadata:
      labels:
        app.kubernetes.io/name: camunda-operator
        app.kubernetes.io/managed-by: kustomize
      name: medium
    spec:
      cluster:
        podLabels:
          company.com/team: "automation-ops"
        podAnnotations:
          company.com/cluster-preset: "medium"
        zeebe:
          replicas: 3
          partitions: 3
          replicationFactor: 3
          resources:
            requests: { cpu: "1", memory: "2Gi" }
            limits: { cpu: "2", memory: "4Gi" }
          storageClassName: "ssd"
          storageSize: "32Gi"
          extraEnv:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+ExitOnOutOfMemoryError -Xmx1g"
        gateway:
          mode: Standalone
          replicas: 2
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
        operate:
          mode: Embedded
        tasklist:
          mode: Embedded
        admin:
          mode: Embedded
        connectors:
          enabled: true
          replicas: 1
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
  - apiVersion: core.camunda.io/v1
    kind: CamundaRelease
    metadata:
      labels:
        app.kubernetes.io/name: camunda-operator
        app.kubernetes.io/managed-by: kustomize
      name: camunda-8-9-0
    spec:
      version: "8.9.0"
      connectors:
        version: "8.9.7"
      elasticsearch:
        version: "9.2.4"
      databaseServer:
        version: "17"
      extraEnv:
        - name: CAMUNDA_FEATURE_FLAG
          value: "true"
  - apiVersion: fleet.camunda.io/v1alpha1
    kind: Environment
    metadata:
      name: production
    spec:
      displayName: Production
      color: "#2E7D32"
      platformConfigRef: camundaplatformconfig-sample
      presets:
        camundaCluster:
          - medium
      releases:
        allowed:
          - camunda-8-9-0
        default: camunda-8-9-0
      sections:
        secondary-storage:
          allowed:
            - existing-secondary-storage
      parameters:
        existing-secondary-storage:
          name:
            claimEditable: true
  - apiVersion: fleet.camunda.io/v1alpha1
    kind: CamundaClusterClaim
    metadata:
      name: orders
      namespace: team-orders
    spec:
      presetRef: medium
      releaseRef: camunda-8-9-0
      platformConfigRef: camundaplatformconfig-sample
      plugins:
        - section: secondary-storage
          registration: existing-secondary-storage
          parameters:
            name: orders-storage
states:
  - name: storage-ready
    description: >-
      Adds the Secret orders-storage-credentials and the
      SecondaryStorageConfig orders-storage of claim-ready. The request
      reports its output, and the claim makes the CamundaCluster orders.
    apply:
      - apiVersion: v1
        kind: Secret
        metadata:
          name: orders-storage-credentials
          namespace: team-orders
        stringData:
          username: camunda
          password: scenario
      - apiVersion: core.camunda.io/v1
        kind: SecondaryStorageConfig
        metadata:
          name: orders-storage
          namespace: team-orders
        spec:
          type: elasticsearch
          elasticsearch:
            endpoint: "https://orders-es-http:9200"
            credentialsSecretRef:
              name: orders-storage-credentials
              usernameKey: username
              passwordKey: password
