# The claim of the harness and what it names. The claim controller writes
# the CamundaCluster camundacluster-sample and its PluginRequests from it,
# as it does for a user. up.sh labels the namespace fleet-smoke with the
# Environment before it applies this file.
#
# The Environment lets the claim name the SecondaryStorageConfig of the
# existing-secondary-storage option: without an Environment, no parameter
# of a built-in option is claim-editable.
apiVersion: fleet.camunda.io/v1alpha1
kind: Environment
metadata:
  name: fleet-harness
spec:
  displayName: Fleet harness
  presets:
    camundaCluster:
      - fleet-harness
  releases:
    allowed:
      - fleet-harness-8-9-0
      - fleet-harness-8-9-1
    default: fleet-harness-8-9-0
  sections:
    access:
      allowed:
        - fleet-harness
    backup-storage:
      allowed:
        - fleet-harness
    secondary-storage:
      allowed:
        - existing-secondary-storage
  parameters:
    existing-secondary-storage:
      name:
        claimEditable: true
---
# One broker with one partition, so that the preset fits a kind node if
# the cluster ever resumes.
apiVersion: core.camunda.io/v1
kind: CamundaClusterPreset
metadata:
  name: fleet-harness
spec:
  cluster:
    zeebe:
      replicas: 1
      partitions: 1
      replicationFactor: 1
---
# Two releases of one minor, so that a journey can move the claim from one
# to the other without a version check of the operator.
apiVersion: core.camunda.io/v1
kind: CamundaRelease
metadata:
  name: fleet-harness-8-9-0
spec:
  version: "8.9.0"
---
apiVersion: core.camunda.io/v1
kind: CamundaRelease
metadata:
  name: fleet-harness-8-9-1
spec:
  version: "8.9.1"
---
# A CamundaCluster needs spec.storageRef, and only a section of the claim
# fills it. No server answers at the endpoint: the cluster is suspended, so
# no component connects to it.
apiVersion: v1
kind: Secret
metadata:
  name: fleet-harness-storage-credentials
  namespace: fleet-smoke
type: Opaque
stringData:
  username: elastic
  password: fleet-harness
---
apiVersion: core.camunda.io/v1
kind: SecondaryStorageConfig
metadata:
  name: fleet-harness-storage
  namespace: fleet-smoke
spec:
  type: elasticsearch
  elasticsearch:
    endpoint: http://fleet-harness-storage.fleet-smoke.svc:9200
    credentialsSecretRef:
      name: fleet-harness-storage-credentials
      usernameKey: username
      passwordKey: password
---
# The claim is suspended, so the operator starts no Camunda pod on kind.
# The fake plugin serves access and backup-storage.
apiVersion: fleet.camunda.io/v1alpha1
kind: CamundaClusterClaim
metadata:
  name: camundacluster-sample
  namespace: fleet-smoke
spec:
  presetRef: fleet-harness
  releaseRef: fleet-harness-8-9-0
  suspend: true
  plugins:
    - section: access
      registration: fleet-harness
    - section: backup-storage
      registration: fleet-harness
    - section: secondary-storage
      registration: existing-secondary-storage
      parameters:
        name: fleet-harness-storage
