{{- if .Values.fleetManager.enabled }}
# The app has no login. This policy allows no traffic from other pods, and
# kubectl port-forward still works, because it reaches the pod through the
# kubelet. Another policy that selects the pod can still allow traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fleet-manager.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-manager.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "fleet-manager.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
{{- end }}
