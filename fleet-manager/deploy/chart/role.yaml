{{- if .Values.fleetManager.enabled }}
# The settings of the app go in the ConfigMap fleet-manager-settings. A create
# rule cannot name one object, so create covers each ConfigMap of this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "fleet-manager.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-manager.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [fleet-manager-settings]
    verbs: [get, update]
{{- end }}
