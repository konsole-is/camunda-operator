# Without engineStrict, pnpm only warns when the Node.js release does not
# match engines.node of package.json, and the gates fail later with odd errors.
engineStrict: true
allowBuilds:
  unrs-resolver: false
  # Storybook brings esbuild. Its install script only checks the binary of
  # the platform package that pnpm installs, and pnpm refuses an install
  # until each build script is allowed or refused.
  esbuild: false
