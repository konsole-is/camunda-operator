name: Chart

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-chart:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Versions below are pinned to .tool-versions. Keep them in sync.
      - name: Install kubebuilder
        run: |
          VERSION=4.13.1
          OS=$(go env GOOS)
          ARCH=$(go env GOARCH)
          curl -fsSL -o kubebuilder \
            "https://github.com/kubernetes-sigs/kubebuilder/releases/download/v${VERSION}/kubebuilder_${OS}_${ARCH}"
          chmod +x kubebuilder && sudo mv kubebuilder /usr/local/bin/
          kubebuilder version

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.1.4

      - name: Generate the Helm chart
        run: make helm-generate IMG=controller:latest

      # Cluster-free gate first: fail fast on template breakage before paying
      # for a kind cluster and an image build.
      - name: Verify the Helm chart
        run: make helm-verify

      - name: Install kind
        run: |
          VERSION=0.31.0
          curl -fsSLo ./kind --retry 5 --retry-delay 10 --retry-all-errors \
            "https://kind.sigs.k8s.io/dl/v${VERSION}/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      # Pinned so the Kubernetes version CI exercises is visible here rather
      # than implied by the kind release. Must be a node image published for
      # the kind version above; bump both together.
      #
      # This is 1.35, matching kubectl in .tool-versions. Chart.yaml declares
      # kubeVersion ">= 1.30.0-0", which CI does not exercise — kind 0.31.0
      # publishes no 1.30 node image (its oldest is v1.31.14).
      - name: Create kind cluster
        run: |
          kind create cluster --image \
            kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f

      - name: Build and load the operator image
        run: |
          make docker-build IMG=controller:latest
          kind load docker-image controller:latest

      - name: Install the chart
        run: make helm-deploy IMG=controller:latest

      - name: Check release status
        run: make helm-status

      # CRD upgrades are the most likely breakage as the API grows. Exercise
      # the upgrade path in CI rather than discovering it in a user's cluster.
      - name: Upgrade the chart
        run: make helm-deploy IMG=controller:latest HELM_EXTRA_ARGS="--set rbacHelpers.enable=true"

      - name: Check upgrade revision
        run: |
          make helm-status
          rev=$(helm get metadata camunda-operator \
            --namespace camunda-operator-system -o json | jq -r '.revision')
          echo "release revision: $rev"
          case "$rev" in
            ''|*[!0-9]*) echo "could not parse release revision: '$rev'"; exit 1 ;;
          esac
          [ "$rev" -ge 2 ] || { echo "expected revision >= 2 after upgrade"; exit 1; }

      - name: Uninstall the chart
        run: make helm-uninstall

      # crd.keep defaults to true, so CRDs must survive uninstall. The
      # expected count is derived from the CRD bases in the checkout, so a
      # PR that adds or removes a kind carries its own expectation.
      - name: Verify CRDs survived uninstall
        run: |
          expected=$(ls config/crd/bases/*.yaml | wc -l)
          count=$(kubectl get crd -o name | grep -c 'core\.camunda\.io' || true)
          echo "CRDs remaining: $count (expected $expected)"
          [ "$count" -eq "$expected" ] || { echo "expected $expected CRDs to be kept, found $count"; exit 1; }
