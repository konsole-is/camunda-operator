name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # The Renovate commit workflow starts this one on the commit it pushes.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The Makefile builds its Go tools into bin/ with go install, and each
      # build downloads the sources of the tool from the Go module proxy. The
      # module cache of setup-go does not hold them: every job saves under the
      # same key, and the job that saves first can be one that builds other
      # tools. So this job keeps bin/ in a cache of its own. When the key
      # changes, the newest older cache is restored, and the Makefile builds
      # only the tools whose version changed.
      - name: Restore the Go tools
        uses: actions/cache@v6
        with:
          path: bin
          key: go-tools-test-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('Makefile', '.custom-gcl.yml', 'go.mod') }}
          restore-keys: go-tools-test-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-

      # The Go module proxy sometimes drops a connection, so tidy is retried.
      # Tidy downloads the modules that the later steps need. A plain
      # "go mod download" does not get all the modules that tidy reads.
      - name: Check that go.mod and go.sum are tidy in every module
        run: |
          hack/ci-retry.sh make tidy
          git diff --exit-code -- go.mod go.sum api/go.mod api/go.sum conformance/go.mod conformance/go.sum

      # A cache miss builds the tools, and the module proxy sometimes drops a
      # connection. The retry keeps one dropped download from failing the
      # job. With the tools in the cache, this step builds nothing.
      - name: Build the Go tools
        run: hack/ci-retry.sh make controller-gen setup-envtest

      # Four test packages start this image through testcontainers. The pull
      # of testcontainers ignores an error in the pull stream, so a failed
      # pull gives "No such image" when the container is created. Pull the
      # image once here, and try again when the pull fails. The tests then
      # find the image and do not pull it. Keep the tag the same as the
      # postgresImage constants of the tests.
      - name: Pull the test Postgres image
        run: |
          for attempt in 1 2 3 4 5; do
            docker pull mirror.gcr.io/library/postgres:17 && exit 0
            [ "$attempt" -lt 5 ] && sleep $((attempt * 10))
          done
          exit 1

      # make test runs make fmt, which rewrites files and checks nothing
      # here. The Lint job checks the format. "-o fmt" skips fmt and the
      # build of golangci-lint that only fmt needs in this job.
      - name: Running Tests
        run: make -o fmt test
        env:
          # The runner VM is discarded after the job, so the Ryuk reaper of
          # testcontainers adds nothing here, and waiting for it is the one
          # part of a container start that times out on a slow Docker daemon
          # ("wait for reaper: context deadline exceeded").
          TESTCONTAINERS_RYUK_DISABLED: "true"

      # A typo in the -X path of the ldflags does not fail the build. The
      # manager then reports 0.0.0-dev in a release. This builds the version
      # test with the ldflags of a release build and checks the Dockerfile.
      - name: Check that a release build reports its tag
        run: make test-version-stamp
