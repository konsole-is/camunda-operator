name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check that go.mod and go.sum are tidy in every module
        run: |
          make tidy
          git diff --exit-code -- go.mod go.sum api/go.mod api/go.sum

      # Four test packages start this image through testcontainers. The pull
      # of testcontainers ignores an error in the pull stream, so a failed
      # pull gives "No such image" when the container is created. Pull the
      # image once here, and try again when the pull fails. The tests then
      # find the image and do not pull it. Keep the tag the same as the
      # postgresImage constants of the tests.
      - name: Pull the test Postgres image
        run: |
          for attempt in 1 2 3 4 5; do
            docker pull mirror.gcr.io/library/postgres:17 && exit 0
            [ "$attempt" -lt 5 ] && sleep $((attempt * 10))
          done
          exit 1

      - name: Running Tests
        run: make test
        env:
          # The runner VM is discarded after the job, so the Ryuk reaper of
          # testcontainers adds nothing here, and waiting for it is the one
          # part of a container start that times out on a slow Docker daemon
          # ("wait for reaper: context deadline exceeded").
          TESTCONTAINERS_RYUK_DISABLED: "true"
