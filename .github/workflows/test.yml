name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check that go.mod and go.sum are tidy in every module
        run: |
          make tidy
          git diff --exit-code -- go.mod go.sum api/go.mod api/go.sum

      - name: Running Tests
        run: make test
        env:
          # The runner VM is discarded after the job, so the Ryuk reaper of
          # testcontainers adds nothing here, and waiting for it is the one
          # part of a container start that times out on a slow Docker daemon
          # ("wait for reaper: context deadline exceeded").
          TESTCONTAINERS_RYUK_DISABLED: "true"
