name: Fleet manager

on:
  push:
    branches: [main]
    paths:
      - fleet-manager/**
      - .github/workflows/fleet-manager.yml
      - config/crd/bases/**
      - config/samples/**
      - docs/crds/api-reference.md
  pull_request:
    paths:
      - fleet-manager/**
      - .github/workflows/fleet-manager.yml
      - config/crd/bases/**
      - config/samples/**
      - docs/crds/api-reference.md

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fleet-manager:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      # The engines field of fleet-manager/package.json pins the same version,
      # and pnpm refuses to install with any other.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: fleet-manager/.node-version

      - name: Run the fleet manager linters
        run: make fleet-lint
      - name: Run the fleet manager tests
        run: make fleet-test
      - name: Build the fleet manager
        run: make fleet-build
      - name: Install the Playwright browser
        run: make fleet-playwright FLEET_PLAYWRIGHT_FLAGS=--with-deps
      - name: Screenshot and check the UI gallery
        run: make fleet-gallery
      - name: Upload the UI gallery
        id: gallery
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-gallery
          path: fleet-manager/ui-gallery/
          if-no-files-found: warn
      - name: Link the UI gallery in the job summary
        if: ${{ !cancelled() && steps.gallery.outputs.artifact-url != '' }}
        env:
          GALLERY_URL: ${{ steps.gallery.outputs.artifact-url }}
        run: |
          echo "UI gallery: [ui-gallery](${GALLERY_URL}). Open index.html in the archive." >> "${GITHUB_STEP_SUMMARY}"
