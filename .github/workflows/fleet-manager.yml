name: Fleet manager

on:
  push:
    branches: [main]
    paths:
      - fleet-manager/**
      - pkg/images/table.json
      - test/fixtures/merge/**
      - test/fixtures/claimpolicy/**
      - api/fleet/v1alpha1/shared_types.go
      - test/fixtures/labels/**
      - api/plugins/v1alpha1/shared_types.go
      - pkg/labels/labels.go
      - pkg/components/camundacluster/names.go
      - internal/pluginstartup/names.go
      - .github/workflows/fleet-manager.yml
      - go.mod
      - go.sum
      - config/crd/bases/**
      - config/samples/**
      - docs/crds/api-reference.md
  pull_request:
    paths:
      - fleet-manager/**
      - pkg/images/table.json
      - test/fixtures/merge/**
      - test/fixtures/claimpolicy/**
      - api/fleet/v1alpha1/shared_types.go
      - test/fixtures/labels/**
      - api/plugins/v1alpha1/shared_types.go
      - pkg/labels/labels.go
      - pkg/components/camundacluster/names.go
      - internal/pluginstartup/names.go
      - .github/workflows/fleet-manager.yml
      - go.mod
      - go.sum
      - config/crd/bases/**
      - config/samples/**
      - docs/crds/api-reference.md
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fleet-manager:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      # The engines field of fleet-manager/package.json pins the same version,
      # and pnpm refuses to install with any other.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: fleet-manager/.node-version
      # make fleet-test runs make setup-envtest, which installs setup-envtest
      # with Go and downloads the envtest binaries.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Download the envtest binaries
        run: make setup-envtest

      - name: Run the fleet manager linters
        run: make fleet-lint
      - name: Run the fleet manager tests
        id: fleet-test
        run: make fleet-test
      # Only a failed test run uploads its output. A run that passes, or a job
      # that fails before this step, uploads nothing.
      - name: Upload the fleet manager test reports
        if: ${{ failure() && steps.fleet-test.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: fleet-test-reports
          path: fleet-manager/test-reports/
          if-no-files-found: error
      # Both targets need the gallery build, and one make call builds it
      # once. -k runs the page scenarios also when the gallery fails.
      - name: Build the fleet manager, check the UI gallery, and run the page scenarios
        run: make -k fleet-gallery fleet-scenarios-test FLEET_PLAYWRIGHT_FLAGS=--with-deps
      - name: Upload the UI gallery
        id: gallery
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-gallery
          path: fleet-manager/ui-gallery/
          if-no-files-found: warn
      - name: Link the UI gallery in the job summary
        if: ${{ !cancelled() && steps.gallery.outputs.artifact-url != '' }}
        env:
          GALLERY_URL: ${{ steps.gallery.outputs.artifact-url }}
        run: |
          echo "UI gallery: [ui-gallery](${GALLERY_URL}). Open index.html in the archive." >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload the UI pages
        id: pages
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-pages
          path: fleet-manager/ui-pages/
          if-no-files-found: warn
      - name: Link the UI pages in the job summary
        if: ${{ !cancelled() && steps.pages.outputs.artifact-url != '' }}
        env:
          PAGES_URL: ${{ steps.pages.outputs.artifact-url }}
        run: |
          echo "UI pages: [ui-pages](${PAGES_URL}). Open index.html in the archive." >> "${GITHUB_STEP_SUMMARY}"

  image:
    name: Build and test the image
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      # The image installs its own Node.js and pnpm, so the job needs no
      # setup step.
      - name: Build and test the fleet manager image
        run: make fleet-image-test FLEET_IMG=fleet-manager:ci
