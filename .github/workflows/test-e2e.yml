name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-e2e:
    name: Camunda ${{ matrix.minor }}${{ matrix.suffix }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Four jobs per supported Camunda minor: one for each storage backend
      # of the orchestration cluster, one for the management plane, and one
      # for the example inventories. All four name the same file
      # test/e2e/matrix/<minor>.env, which holds the image versions of the
      # minor, and each holds the Ginkgo label filter that selects its flows.
      # Adopting a new minor adds the file and four entries.
      #
      # The split keeps one storage operator off each of the first three jobs.
      # One kind node carries a whole job. eckInstallSkip and cnpgInstallSkip
      # say which operator a job installs. The management plane job fills its
      # node with Keycloak, Management Identity, Console, and two Web Modeler
      # processes, so it installs neither CloudNativePG nor the Barman Cloud
      # plugin.
      #
      # The example job installs both storage operators, because
      # config/example holds an inventory for each backend. Its specs run one
      # at a time, and each one removes its namespaces before the next one
      # applies, so one backend runs at a time. The inventories carry fixed
      # resource names, which is the second reason the job stands alone.
      #
      # Every label of the suite belongs to exactly one entry. The test
      # TestWorkflowJobsClaimEveryLabel in test/utils reads this file and
      # fails when a label has no job, or more than one.
      matrix:
        include:
          - minor: "8.9"
            suffix: " elasticsearch"
            labels: "manager || camundacluster || camundacluster-oidc || elasticsearchcluster || camundaoptimize"
            eckInstallSkip: "false"
            cnpgInstallSkip: "true"
          - minor: "8.9"
            suffix: " postgres"
            labels: "camundacluster-rdbms || database || databaseserver"
            eckInstallSkip: "true"
            cnpgInstallSkip: "false"
          - minor: "8.9"
            suffix: " management"
            labels: "management-keycloak || management-oidc"
            eckInstallSkip: "false"
            cnpgInstallSkip: "true"
          - minor: "8.9"
            suffix: " examples"
            labels: "example"
            eckInstallSkip: "false"
            cnpgInstallSkip: "false"
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          VERSION=$(awk '$1 == "kind" { print $2 }' .tool-versions)
          curl -fsSLo ./kind --retry 5 --retry-delay 10 --retry-all-errors \
            "https://kind.sigs.k8s.io/dl/v${VERSION}/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      # The Elasticsearch node that the suite runs through ECK needs this
      # kernel limit on the kind host.
      - name: Raise vm.max_map_count for Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144

      # The Go module proxy sometimes drops a connection, so tidy is retried.
      # Tidy downloads the modules that the e2e run needs. A plain
      # "go mod download" does not get all the modules that tidy reads.
      - name: Tidy the Go modules
        run: hack/ci-retry.sh make tidy

      # The management job has twice lost its runner in the middle of the
      # suite, with no Ginkgo failure and no dump of the cluster. The sampler
      # runs inside this step and writes one [node] line every 30 seconds to
      # the job log, which GitHub receives live and keeps when the runner goes.
      # The full detail goes to a file, which the upload below keeps whenever
      # the runner survives. The trap takes the sampler down with the step.
      - name: Running Test e2e
        env:
          ECK_INSTALL_SKIP: ${{ matrix.eckInstallSkip }}
          CNPG_INSTALL_SKIP: ${{ matrix.cnpgInstallSkip }}
        run: |
          cat > "${RUNNER_TEMP}/sample-node-pressure.sh" <<'SAMPLER'
          #!/usr/bin/env bash
          # Busy and idle jiffies of the aggregate CPU line. iowait counts as
          # idle, so the figure answers "was the node out of CPU".
          cpu_jiffies() {
            awk '/^cpu / {
              total = 0
              for (i = 2; i <= 9 && i <= NF; i++) { total += $i }
              print total, $5 + $6
              exit
            }' /proc/stat
          }
          cores=$(nproc)
          read -r previous_total previous_idle <<< "$(cpu_jiffies)"
          while true; do
            {
              echo "=== $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              free -m
              df -h /
              ps -eo rss,comm --sort=-rss | head -15
              docker stats --no-stream --format '{{.Name}} {{.MemUsage}} {{.CPUPerc}}' || true
            } >> "${RUNNER_TEMP}/node-pressure.log" 2>&1
            memory=$(free -m | awk '/^Mem:/ {print "free=" $4 "MiB avail=" $7 "MiB"}')
            # Each line reports the span since the line before it. The first
            # line covers the time the first pass of the loop took.
            read -r total idle <<< "$(cpu_jiffies)"
            span=$((total - previous_total))
            busy=$((span - idle + previous_idle))
            previous_total=${total}
            previous_idle=${idle}
            cpu="n/a"
            if [ "${span}" -gt 0 ]; then
              cpu=$(awk -v b="${busy}" -v s="${span}" \
                'BEGIN {printf "%.0f%%", b * 100 / s}')
            fi
            read -r load1 _ < /proc/loadavg
            host="cpu=${cpu} load1=${load1} cores=${cores}"
            top=$(ps -eo rss=,comm= --sort=-rss | head -5 | awk '{printf "%s=%dMiB ", $2, $1 / 1024}')
            busiest=$(docker stats --no-stream --format '{{.Name}}={{.MemUsage}}' 2>/dev/null | tr '\n' ' ')
            # The manager runs under a 128Mi limit and often drops out of the
            # top list, so its memory and its restarts are on each line. A
            # stall then shows whether the container was killed.
            manager_rss=$(ps -eo rss=,comm= | awk '$2 == "manager" {printf "%dMiB ", $1 / 1024}')
            manager_pod=$(kubectl get pods -n camunda-operator-system -l control-plane=controller-manager \
              --request-timeout=5s -o jsonpath='{range .items[*].status.containerStatuses[*]}restarts={.restartCount} last={.lastState.terminated.reason} {end}' 2>/dev/null)
            echo "[node] $(date -u +%H:%M:%SZ) ${memory} ${host} | top: ${top}| docker: ${busiest}| manager: rss=${manager_rss:-none} ${manager_pod:-pod=none}"
            sleep 30
          done
          SAMPLER
          chmod +x "${RUNNER_TEMP}/sample-node-pressure.sh"
          setsid "${RUNNER_TEMP}/sample-node-pressure.sh" &
          sampler=$!
          trap 'kill -- -"${sampler}" 2>/dev/null || true' EXIT

          make test-e2e E2E_CAMUNDA_MINOR=${{ matrix.minor }} E2E_LABEL_FILTER='${{ matrix.labels }}'

      # Both reads fail when the API server is gone, which is one of the
      # answers this step is here to record. The output goes to the job log as
      # well, so it is there without the artifact.
      - name: Read the cluster into the node pressure sample
        if: always()
        run: |
          {
            echo "=== pods"
            kubectl get pods -A -o wide || true
            echo "=== nodes"
            kubectl describe nodes || true
          } 2>&1 | tee -a "${RUNNER_TEMP}/node-pressure.log"

      - name: Upload the node pressure sample
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-pressure-${{ matrix.minor }}${{ matrix.suffix }}
          path: ${{ runner.temp }}/node-pressure.log
          retention-days: 7

  # The fleet manager journeys run only when a path that they test changes,
  # and on each push to main. A paths filter of the workflow would also stop
  # the Camunda matrix above, so this job decides for the journeys alone.
  fleet-changes:
    name: Fleet manager journeys needed
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Clone the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare the changed paths with the journey inputs
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "${EVENT}" != "pull_request" ]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          pattern='^(fleet-manager/|test/e2e/fakeplugin/|test/e2e/gitserver/|conformance/echo/|hack/(helmfleet|helmcrds|helmcli|helmschema)/|config/|dist/chart/Chart\.yaml$|Makefile$|test/e2e/testdata/rustfs\.yaml$|\.github/workflows/test-e2e\.yml$)'
          if git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | grep -qE "${pattern}"; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
          fi

  fleet-journeys:
    name: Fleet manager journeys
    needs: fleet-changes
    if: needs.fleet-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # pnpm refuses any Node.js version other than the one of this file.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: fleet-manager/.node-version

      # kubebuilder and kind install the versions of .tool-versions, so a
      # Renovate update of that file moves this job too.
      - name: Install kind and kubebuilder
        run: |
          KIND_VERSION=$(awk '$1 == "kind" { print $2 }' .tool-versions)
          curl -fsSLo ./kind --retry 5 --retry-delay 10 --retry-all-errors \
            "https://kind.sigs.k8s.io/dl/v${KIND_VERSION}/kind-linux-$(go env GOARCH)"
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
          KUBEBUILDER_VERSION=$(awk '$1 == "kubebuilder" { print $2 }' .tool-versions)
          curl -fsSL -o kubebuilder --retry 5 --retry-delay 10 --retry-all-errors \
            "https://github.com/kubernetes-sigs/kubebuilder/releases/download/v${KUBEBUILDER_VERSION}/kubebuilder_$(go env GOOS)_$(go env GOARCH)"
          chmod +x kubebuilder && sudo mv kubebuilder /usr/local/bin/
          kind version
          kubebuilder version

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.0

      # The Go module proxy sometimes drops a connection. The retry keeps
      # one dropped download from failing the job.
      - name: Download the Go modules
        run: hack/ci-retry.sh go mod download

      - name: Create the harness cluster
        run: make fleet-harness-up

      # A process that a step starts in the background lives on in the later
      # steps of the job.
      - name: Start the Git apply loop
        run: setsid fleet-manager/e2e/harness/apply-loop.sh > "${RUNNER_TEMP}/apply-loop.log" 2>&1 &

      - name: Check the harness
        run: make fleet-harness-check

      - name: Run the journeys
        run: make fleet-journeys FLEET_PLAYWRIGHT_FLAGS=--with-deps

      - name: Upload the UI journeys
        id: journeys
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-journeys
          path: fleet-manager/ui-journeys/
          if-no-files-found: warn
      - name: Link the UI journeys in the job summary
        if: ${{ !cancelled() && steps.journeys.outputs.artifact-url != '' }}
        env:
          JOURNEYS_URL: ${{ steps.journeys.outputs.artifact-url }}
        run: |
          echo "UI journeys: [ui-journeys](${JOURNEYS_URL}). Open index.html in the archive." >> "${GITHUB_STEP_SUMMARY}"

      - name: Read the harness cluster
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get pluginrequests,pluginregistrations -A -o yaml || true
          for target in \
            "camunda-operator-system deployment/camunda-operator-fleet-manager" \
            "camunda-operator-system deployment/camunda-operator-controller-manager" \
            "fleet-harness deployment/fakeplugin" \
            "fleet-harness deployment/git"; do
            read -r namespace workload <<< "${target}"
            echo "=== logs of ${workload} in ${namespace}"
            kubectl logs -n "${namespace}" "${workload}" --all-containers --tail=300 || true
          done
          echo "=== apply loop"
          cat "${RUNNER_TEMP}/apply-loop.log" || true
