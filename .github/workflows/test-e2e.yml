name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-e2e:
    name: Camunda ${{ matrix.minor }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One job per supported Camunda minor. Each entry names a file
      # test/e2e/versions/<minor>.env that holds the image versions of that
      # minor. Adopting a new minor adds the file and the entry.
      matrix:
        minor: ["8.9"]
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -fsSLo ./kind --retry 5 --retry-delay 10 --retry-all-errors https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      # The Elasticsearch node that the suite runs through ECK needs this
      # kernel limit on the kind host.
      - name: Raise vm.max_map_count for Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Running Test e2e
        run: |
          make tidy
          make test-e2e E2E_CAMUNDA_MINOR=${{ matrix.minor }}
