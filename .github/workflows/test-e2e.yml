name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-e2e:
    name: Camunda ${{ matrix.minor }}${{ matrix.suffix }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Three jobs per supported Camunda minor: one for each storage
      # backend of the orchestration cluster, and one for the management
      # plane. All three name the same file test/e2e/matrix/<minor>.env,
      # which holds the image versions of the minor, and each holds the
      # Ginkgo label filter that selects its flows. Adopting a new minor adds
      # the file and three entries.
      #
      # The split keeps one storage operator off each job. One kind node
      # carries a whole job, and no flow needs both ECK and CloudNativePG.
      # eckInstallSkip and cnpgInstallSkip say which operator a job installs.
      # The management plane job fills its node with Keycloak, Management
      # Identity, Console, and two Web Modeler processes, so it installs
      # neither CloudNativePG nor the Barman Cloud plugin.
      #
      # Every label of the suite belongs to exactly one entry. The test
      # TestWorkflowJobsClaimEveryLabel in test/utils reads this file and
      # fails when a label has no job, or more than one.
      matrix:
        include:
          - minor: "8.9"
            suffix: " elasticsearch"
            labels: "manager || camundacluster || camundacluster-oidc || elasticsearchcluster || camundaoptimize"
            eckInstallSkip: "false"
            cnpgInstallSkip: "true"
          - minor: "8.9"
            suffix: " postgres"
            labels: "camundacluster-rdbms || database || databaseserver"
            eckInstallSkip: "true"
            cnpgInstallSkip: "false"
          - minor: "8.9"
            suffix: " management"
            labels: "management-keycloak || management-oidc"
            eckInstallSkip: "false"
            cnpgInstallSkip: "true"
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -fsSLo ./kind --retry 5 --retry-delay 10 --retry-all-errors https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      # The Elasticsearch node that the suite runs through ECK needs this
      # kernel limit on the kind host.
      - name: Raise vm.max_map_count for Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Running Test e2e
        env:
          ECK_INSTALL_SKIP: ${{ matrix.eckInstallSkip }}
          CNPG_INSTALL_SKIP: ${{ matrix.cnpgInstallSkip }}
        run: |
          make tidy
          make test-e2e E2E_CAMUNDA_MINOR=${{ matrix.minor }} E2E_LABEL_FILTER='${{ matrix.labels }}'
