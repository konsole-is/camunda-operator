name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-e2e:
    name: Camunda ${{ matrix.minor }}${{ matrix.suffix }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Two jobs per supported Camunda minor, so the management plane flows
      # and the rest of the suite get a verdict each. Both entries of a pair
      # name the same file test/e2e/matrix/<minor>.env, which holds the image
      # versions of the minor. Each entry holds the Ginkgo label filter that
      # selects its flows. Adopting a new minor adds the file and a pair of
      # entries.
      matrix:
        include:
          - minor: "8.9"
            suffix: ""
            labels: "!management-keycloak && !management-oidc"
          - minor: "8.9"
            suffix: " management"
            labels: "management-keycloak || management-oidc"
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -fsSLo ./kind --retry 5 --retry-delay 10 --retry-all-errors https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      # The Elasticsearch node that the suite runs through ECK needs this
      # kernel limit on the kind host.
      - name: Raise vm.max_map_count for Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Running Test e2e
        run: |
          make tidy
          make test-e2e E2E_CAMUNDA_MINOR=${{ matrix.minor }} E2E_LABEL_FILTER='${{ matrix.labels }}'
