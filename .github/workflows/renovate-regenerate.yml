name: Renovate regenerate

# Renovate updates inputs of files that Lint checks for drift: the images
# table reads test/e2e/matrix, and the API reference reads go.mod. This
# workflow regenerates those files on a Renovate branch and uploads the
# changed ones for the Renovate commit workflow to commit.
on:
  push:
    branches: ["renovate/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This workflow runs code of the branch, so its token can only read.
permissions:
  contents: read

jobs:
  regenerate:
    name: Run on Ubuntu
    # A branch deletion also sends a push event, and its run checks out the
    # default branch.
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download the Go modules
        run: |
          hack/ci-retry.sh go mod download
          hack/ci-retry.sh go -C api mod download

      # The same generators as the drift checks of lint.yml.
      - name: Run the generators
        run: make observability merge-fixtures api-docs generate

      - name: Collect the changed files
        id: changes
        run: |
          paths=(config/prometheus/observability test/fixtures/merge docs/crds/api-reference.md pkg/images/table.json)
          git add --all -- "${paths[@]}"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir "$RUNNER_TEMP/changes"
          git diff --cached --name-only --no-renames --diff-filter=d -z |
            while IFS= read -r -d '' f; do
              jq -n --arg path "$f" --rawfile contents <(base64 -w0 -- "$f") '{$path, $contents}'
            done > "$RUNNER_TEMP/changes/additions.json"
          git diff --cached --name-only --no-renames --diff-filter=D -z |
            while IFS= read -r -d '' f; do
              jq -n --arg path "$f" '{$path}'
            done > "$RUNNER_TEMP/changes/deletions.json"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload the changed files
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: changes
          path: ${{ runner.temp }}/changes
          retention-days: 1
