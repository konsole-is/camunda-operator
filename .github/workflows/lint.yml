name: Lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint

      # Renovate's validator is an npm package. The runner's default Node is
      # older than the one Renovate supports, which is a warning today and a
      # refusal later.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Renovate configuration
        run: make lint-renovate
