name: Lint

on:
  push:
    branches: [main]
  pull_request:
  # The Renovate commit workflow starts this one on the commit it pushes.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The Makefile builds its Go tools into bin/ with go install, and each
      # build downloads the sources of the tool from the Go module proxy. The
      # module cache of setup-go does not hold them: every job saves under the
      # same key, and the job that saves first can be one that builds other
      # tools. So this job keeps bin/ in a cache of its own. When the key
      # changes, the newest older cache is restored, and the Makefile builds
      # only the tools whose version changed.
      - name: Restore the Go tools
        uses: actions/cache@v6
        with:
          path: bin
          key: go-tools-lint-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('Makefile', '.custom-gcl.yml', 'go.mod') }}
          restore-keys: go-tools-lint-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-

      # The Go module proxy sometimes drops a connection. The retry keeps
      # one dropped download from failing the job.
      - name: Download the Go modules
        run: |
          hack/ci-retry.sh go mod download
          hack/ci-retry.sh go -C api mod download
          hack/ci-retry.sh go -C conformance mod download

      # A cache miss builds the tools, and the module proxy sometimes drops a
      # connection. The retry keeps one dropped download from failing the
      # job. With the tools in the cache, this step builds nothing.
      - name: Build the Go tools
        run: hack/ci-retry.sh make golangci-lint controller-gen crd-ref-docs setup-envtest

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint

      # The rendered files are the output of the ocf version in go.mod. A bump
      # that changes a template must re-render them in the same change.
      - name: Check that the observability artifacts are rendered
        run: |
          make observability
          git add --intent-to-add config/prometheus/observability
          git diff --exit-code -- config/prometheus/observability

      # The merged field of each case under test/fixtures/merge is the output
      # of a merge function. A change to a merge must regenerate the cases in
      # the same change.
      - name: Check that the merge fixtures are generated
        run: |
          make merge-fixtures
          git diff --exit-code -- test/fixtures/merge

      # The result of each case under test/fixtures/claimpolicy is the output
      # of a function of pkg/claimpolicy. A change to a rule must regenerate
      # the cases in the same change.
      - name: Check that the claim policy fixtures are generated
        run: |
          make claimpolicy-fixtures
          git diff --exit-code -- test/fixtures/claimpolicy

      # docs/crds/api-reference.md is rendered from the GoDoc in api/. A
      # change to a type must re-render it in the same change.
      - name: Check that the API reference is rendered
        run: |
          make api-docs
          git diff --exit-code -- docs/crds/api-reference.md

      # pkg/images/table.json is generated from pkg/images and the entries of
      # test/e2e/matrix. A change to either must regenerate it in the same
      # change.
      - name: Check that the images table is generated
        run: |
          make generate
          git add --intent-to-add pkg/images/table.json
          git diff --exit-code -- pkg/images/table.json

      # The fleet manager reads the CRDs and the condition types of api/
      # through fleet-manager/src/generated. A change to a CRD, a field
      # description, or a condition type must regenerate it in the same change.
      - name: Setup Node for the fleet manager
        uses: actions/setup-node@v7
        with:
          node-version-file: fleet-manager/.node-version
      - name: Check that the fleet manager types are generated
        run: |
          make fleet-generate
          git add --intent-to-add fleet-manager/src/generated
          git diff --exit-code -- fleet-manager/src/generated

      # The files beside each scenario.yaml under fleet-manager/e2e/scenarios
      # are what the reconcilers write on envtest. A change to a reconciler
      # that changes what it writes must regenerate them in the same change.
      - name: Check that the page scenarios are generated
        run: |
          make fleet-scenarios
          git add --intent-to-add fleet-manager/e2e/scenarios
          git diff --exit-code -- fleet-manager/e2e/scenarios

      - name: Check the docs against the simple-english rules
        run: make docs-sentences

      # The release workflow publishes the docs site. A page that breaks the
      # strict build fails here, not at the release.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install MkDocs
        run: pip install -r requirements-docs.txt
      - name: Build the docs site
        run: make docs-build

      # Renovate's validator is an npm package. The runner's default Node is
      # older than the one Renovate supports, which is a warning today and a
      # refusal later.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Check Renovate configuration
        run: make lint-renovate
