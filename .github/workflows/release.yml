name: Release

on:
  release:
    types: [published]
  # A run by hand is a dry run of the release of its tag on the chosen
  # branch. It builds and checks everything and pushes nothing.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check, for example v0.3.0. The run pushes nothing.
        required: true
        type: string

jobs:
  # The scan job runs before the release job pushes anything, the Go module
  # tags included. An image with a HIGH or CRITICAL finding that has a fix then
  # stops the release before it uses up the version. The matrix lists the
  # PLATFORMS of the Makefile. Each job builds one platform with the make
  # targets that push the images, and loads it into Docker for Trivy.
  scan:
    name: Scan the ${{ matrix.platform }} images
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]

    env:
      IMG: camunda-operator:scan
      CLI_IMG: camunda-operator-cli:scan
      FLEET_IMG: camunda-operator-fleet-manager:scan
      CONFORMANCE_IMG: camunda-operator-plugin-conformance:scan

    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      # The fleet manager image builds each platform in emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the images
        id: build
        run: |
          make docker-buildx "IMG=${IMG}" "PLATFORMS=${{ matrix.platform }}" BUILDX_OUTPUT=--load
          make docker-buildx-cli "CLI_IMG=${CLI_IMG}" "PLATFORMS=${{ matrix.platform }}" BUILDX_OUTPUT=--load
          make docker-buildx-fleet "FLEET_IMG=${FLEET_IMG}" "PLATFORMS=${{ matrix.platform }}" BUILDX_OUTPUT=--load
          make docker-buildx-conformance "CONFORMANCE_IMG=${CONFORMANCE_IMG}" "PLATFORMS=${{ matrix.platform }}" BUILDX_OUTPUT=--load

      # The Security workflow explains the pin of trivy-action.
      - name: Scan the operator image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # The CLI scan runs when the operator scan fails too, so one run shows
      # the findings of both images.
      - name: Scan the CLI image
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.CLI_IMG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan the fleet manager image
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.FLEET_IMG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan the plugin conformance image
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.CONFORMANCE_IMG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # The image of each platform starts in emulation, so a native package
      # of the wrong platform stops the release here.
      - name: Test the fleet manager image
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          TEST_IMAGE_TIMEOUT: "300"
        run: fleet-manager/deploy/test-image.sh "${FLEET_IMG}"

  release:
    name: Build and publish artifacts
    needs: scan
    runs-on: ubuntu-latest

    permissions:
      contents: write   # upload release assets
      packages: write   # push to ghcr
      id-token: write   # keyless cosign signing via OIDC

    env:
      # The release tag (v0.1.0) is also the Go tag of the root module. A dry
      # run takes it from its input. The step "Derive the version from the
      # tag" sets VERSION (0.1.0) for the chart and the images, because a Helm
      # chart version must be bare SemVer.
      TAG: ${{ inputs.tag || github.ref_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
      CHART_REGISTRY: oci://ghcr.io/konsole-is/charts
      CHART_REPO: ghcr.io/konsole-is/charts/camunda-operator

    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The Go module proxy sometimes drops a connection. The retry keeps
      # one dropped download from failing the job.
      - name: Download the Go modules
        run: |
          hack/ci-retry.sh go mod download
          hack/ci-retry.sh go -C api mod download
          hack/ci-retry.sh go -C conformance mod download

      # CLI_IMG is the companion image that the Jobs of the operator run. The
      # chart and install.yaml pass it to the manager through
      # --camunda-operator-cli-image. FLEET_IMG is the image of the chart value
      # fleetManager.enabled. CONFORMANCE_IMG is the image of
      # plugin-conformance. Without an output, a dry run builds the images
      # into the buildx cache only.
      - name: Derive the version from the tag
        run: |
          num='(0|[1-9][0-9]*)'
          pre="(${num}|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          if [[ ! "${TAG}" =~ ^v${num}\.${num}\.${num}(-${pre}(\.${pre})*)?$ ]]; then
            echo "Tag '${TAG}' is not a release tag such as v0.1.0 or v0.1.0-rc.1." >&2
            exit 1
          fi
          version="${TAG#v}"
          {
            echo "VERSION=${version}"
            echo "IMG=ghcr.io/${GITHUB_REPOSITORY}:${version}"
            echo "CLI_IMG=ghcr.io/${GITHUB_REPOSITORY}-cli:${version}"
            echo "FLEET_IMG=ghcr.io/${GITHUB_REPOSITORY}-fleet-manager:${version}"
            echo "CONFORMANCE_IMG=ghcr.io/${GITHUB_REPOSITORY}-plugin-conformance:${version}"
          } >> "${GITHUB_ENV}"
          if [[ "${DRY_RUN}" == true ]]; then
            echo "BUILDX_OUTPUT=" >> "${GITHUB_ENV}"
          else
            echo "BUILDX_OUTPUT=--push" >> "${GITHUB_ENV}"
          fi

      # Consumers of each module ignore its replace directives and fetch the
      # required versions. So the root go.mod and conformance/go.mod must
      # already name the module versions that this release publishes.
      - name: Check the module pins
        run: |
          if ! make check-release-pins VERSION="${VERSION}"; then
            echo "Delete this release and its tag ${TAG}, run the Prepare release workflow with ${TAG}, merge its pull request, then publish the release again." >&2
            exit 1
          fi

      # The api and conformance modules live in subdirectories, so their Go
      # tags carry the directory as a prefix. One atomic push sends both, so
      # a failed push leaves neither.
      - name: Push the Go module tags
        run: |
          head=$(git rev-parse HEAD)
          push=()
          for tag in "api/${TAG}" "conformance/${TAG}"; do
            existing=$(git ls-remote --tags origin "refs/tags/${tag}" | cut -f1)
            if [[ -n "${existing}" && "${existing}" != "${head}" ]]; then
              echo "Tag '${tag}' exists and points at ${existing}, not at ${head}." >&2
              exit 1
            fi
            if [[ -z "${existing}" ]]; then
              git tag "${tag}" "${head}"
              push+=("refs/tags/${tag}")
            fi
          done
          if [[ "${DRY_RUN}" == true ]]; then
            echo "Dry run: a release pushes ${push[*]:-no Go tag} at ${head}." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          if (( ${#push[@]} > 0 )); then
            git push --atomic origin "${push[@]}"
          fi

      # kubebuilder installs the version of .tool-versions.
      - name: Install kubebuilder
        run: |
          VERSION=$(awk '$1 == "kubebuilder" { print $2 }' .tool-versions)
          OS=$(go env GOOS)
          ARCH=$(go env GOARCH)
          curl -fsSL -o kubebuilder \
            "https://github.com/kubernetes-sigs/kubebuilder/releases/download/v${VERSION}/kubebuilder_${OS}_${ARCH}"
          chmod +x kubebuilder && sudo mv kubebuilder /usr/local/bin/

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.1

      # cosign-installer v4 is the first major that can install cosign v3.
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.4

      # The fleet manager image builds each platform in emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: env.DRY_RUN != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate the chart and installer manifests
        run: make helm-generate IMG="${IMG}" CLI_IMG="${CLI_IMG}" FLEET_IMG="${FLEET_IMG}"

      - name: Stamp the release version into Chart.yaml
        run: |
          sed -i -e "s/^version: .*/version: ${VERSION}/" dist/chart/Chart.yaml
          sed -i -e "s/^appVersion: .*/appVersion: \"${VERSION}\"/" dist/chart/Chart.yaml
          # The delimiter is #, because \| is the alternation of the expression.
          sed -i -e "s#\(image: ghcr.io/konsole-is/camunda-operator\(-cli\|-fleet-manager\)\{0,1\}\):.*#\1:${VERSION}#" dist/chart/Chart.yaml
          grep -E '^(version|appVersion):|image: ' dist/chart/Chart.yaml

      - name: Verify the chart
        run: make helm-verify

      - name: Build and push the operator image
        run: make docker-buildx IMG="${IMG}" OPERATOR_VERSION="${VERSION}" BUILDX_OUTPUT="${BUILDX_OUTPUT}"

      - name: Resolve the image digest
        id: image
        if: env.DRY_RUN != 'true'
        run: |
          digest=$(docker buildx imagetools inspect "${IMG}" \
            --format '{{.Manifest.Digest}}')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "image digest: ${digest}"

      - name: Build and push the CLI image
        run: make docker-buildx-cli CLI_IMG="${CLI_IMG}" BUILDX_OUTPUT="${BUILDX_OUTPUT}"

      - name: Resolve the CLI image digest
        id: cli
        if: env.DRY_RUN != 'true'
        run: |
          digest=$(docker buildx imagetools inspect "${CLI_IMG}" \
            --format '{{.Manifest.Digest}}')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "cli image digest: ${digest}"

      - name: Build and push the fleet manager image
        run: make docker-buildx-fleet FLEET_IMG="${FLEET_IMG}" BUILDX_OUTPUT="${BUILDX_OUTPUT}"

      - name: Resolve the fleet manager image digest
        id: fleet
        if: env.DRY_RUN != 'true'
        run: |
          digest=$(docker buildx imagetools inspect "${FLEET_IMG}" \
            --format '{{.Manifest.Digest}}')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "fleet manager image digest: ${digest}"

      - name: Build and push the plugin conformance image
        run: make docker-buildx-conformance CONFORMANCE_IMG="${CONFORMANCE_IMG}" BUILDX_OUTPUT="${BUILDX_OUTPUT}"

      - name: Resolve the plugin conformance image digest
        id: conformance
        if: env.DRY_RUN != 'true'
        run: |
          digest=$(docker buildx imagetools inspect "${CONFORMANCE_IMG}" \
            --format '{{.Manifest.Digest}}')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "plugin conformance image digest: ${digest}"

      - name: Package the chart
        run: helm package dist/chart --destination dist

      - name: Push the chart
        id: chart
        if: env.DRY_RUN != 'true'
        run: |
          # The default `bash -e {0}` Actions shell does not imply pipefail:
          # `helm push ... | tee` would otherwise swallow a failing push's
          # exit code. Without this, a failed push could leave `digest`
          # empty (caught below) or, worse, matching an unrelated sha256
          # embedded in an error message (e.g. "digest mismatch: expected
          # sha256:...").
          set -o pipefail
          helm push "dist/camunda-operator-${VERSION}.tgz" "${CHART_REGISTRY}" 2>&1 | tee push.log
          # Anchored to the literal "Digest:" line helm emits on success, so
          # a sha256 mentioned incidentally in an error message (digest
          # mismatch, failed manifest push, etc.) can't be mistaken for the
          # real one.
          digest=$(sed -n 's/^Digest:[[:space:]]*\(sha256:[0-9a-f]\{64\}\).*/\1/p' push.log | head -1)
          if [ -z "$digest" ]; then
            echo "Could not parse the chart digest from helm push output." >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "chart digest: ${digest}"

      - name: Install oras
        if: env.DRY_RUN != 'true'
        uses: oras-project/setup-oras@v2.0.2
        with:
          version: 1.3.4

      # Artifact Hub reads the repository metadata from the tag artifacthub.io
      # of the chart repository, with these media types:
      # https://artifacthub.io/docs/topics/repositories/helm-charts/
      - name: Push the Artifact Hub repository metadata
        if: env.DRY_RUN != 'true'
        working-directory: .github
        run: |
          oras push "${CHART_REPO}:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      # Sign by digest, never by tag — tags are mutable.
      - name: Sign the image
        if: env.DRY_RUN != 'true'
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}"

      - name: Sign the CLI image
        if: env.DRY_RUN != 'true'
        run: cosign sign --yes "ghcr.io/${{ github.repository }}-cli@${{ steps.cli.outputs.digest }}"

      - name: Sign the fleet manager image
        if: env.DRY_RUN != 'true'
        run: cosign sign --yes "ghcr.io/${{ github.repository }}-fleet-manager@${{ steps.fleet.outputs.digest }}"

      - name: Sign the plugin conformance image
        if: env.DRY_RUN != 'true'
        run: cosign sign --yes "ghcr.io/${{ github.repository }}-plugin-conformance@${{ steps.conformance.outputs.digest }}"

      - name: Sign the chart
        if: env.DRY_RUN != 'true'
        run: cosign sign --yes "${CHART_REPO}@${{ steps.chart.outputs.digest }}"

      - name: Build the plugin conformance binaries
        run: make dist-conformance

      # gh release upload looks up the release and then uses the asset API.
      # Unlike softprops/action-gh-release, it does not edit the release; GitHub
      # rejected that edit for v0.1.1 (softprops/action-gh-release#836).
      - name: Upload release assets
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${TAG}" --clobber \
            dist/install.yaml \
            dist/crds.yaml \
            "dist/camunda-operator-${VERSION}.tgz" \
            dist/plugin-conformance-*

      - name: Summarize the dry run
        if: env.DRY_RUN == 'true'
        run: |
          {
            echo "Dry run of ${TAG} at $(git rev-parse HEAD)."
            echo
            echo "The run pushed no Go tag, image, chart, signature, release asset, or docs version."
          } >> "${GITHUB_STEP_SUMMARY}"

  docs:
    name: Publish the docs site
    needs: release
    # latest documents the newest stable release, so a prerelease leaves the
    # site as it is. A dry run publishes no docs.
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    # The Docs workflow deploys dev in the same group, so two pushes to
    # gh-pages never race.
    concurrency:
      group: gh-pages
      cancel-in-progress: false

    permissions:
      contents: write   # push to gh-pages

    steps:
      - name: Clone the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt

      # One docs version per minor release, such as 0.1, with the alias latest.
      # A patch release replaces the docs of its minor.
      - name: Deploy the release version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          minor=$(echo "${TAG#v}" | cut -d. -f1,2)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mike deploy --push --update-aliases --title "${minor}" "${minor}" latest
          mike set-default --push latest
