name: Release

on:
  release:
    types: [published]

jobs:
  release:
    name: Build and publish artifacts
    runs-on: ubuntu-latest

    permissions:
      contents: write   # upload release assets
      packages: write   # push to ghcr
      id-token: write   # keyless cosign signing via OIDC

    env:
      # The release tag (v0.1.0) is also the Go tag of the root module. The
      # step "Derive the version from the tag" sets VERSION (0.1.0) for the
      # chart and the images, because a Helm chart version must be bare SemVer.
      TAG: ${{ github.ref_name }}
      CHART_REGISTRY: oci://ghcr.io/konsole-is/charts
      CHART_REPO: ghcr.io/konsole-is/charts/camunda-operator

    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The Go module proxy sometimes drops a connection. The retry keeps
      # one dropped download from failing the job.
      - name: Download the Go modules
        run: |
          hack/ci-retry.sh go mod download
          hack/ci-retry.sh go -C api mod download

      # CLI_IMG is the companion image that the Jobs of the operator run. The
      # chart and install.yaml pass it to the manager through
      # --camunda-operator-cli-image.
      - name: Derive the version from the tag
        run: |
          num='(0|[1-9][0-9]*)'
          pre="(${num}|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          if [[ ! "${TAG}" =~ ^v${num}\.${num}\.${num}(-${pre}(\.${pre})*)?$ ]]; then
            echo "Tag '${TAG}' is not a release tag such as v0.1.0 or v0.1.0-rc.1." >&2
            exit 1
          fi
          version="${TAG#v}"
          {
            echo "VERSION=${version}"
            echo "IMG=ghcr.io/${GITHUB_REPOSITORY}:${version}"
            echo "CLI_IMG=ghcr.io/${GITHUB_REPOSITORY}-cli:${version}"
          } >> "${GITHUB_ENV}"

      # The api module lives in a subdirectory, so its Go tag carries the
      # directory as a prefix. The root go.mod must already name the api
      # version that this release publishes, because consumers of the root
      # module ignore its replace directive and fetch that version.
      - name: Check that the root go.mod pins the api module at this release
        run: |
          want="${TAG}"
          have=$(go list -m -f '{{.Version}}' github.com/konsole-is/camunda-operator/api)
          if [[ "${have}" != "${want}" ]]; then
            echo "go.mod requires api module ${have}, release needs ${want}." >&2
            echo "Delete this release and its tag ${TAG}, run the Prepare release workflow with ${TAG}, merge its pull request, then publish the release again." >&2
            exit 1
          fi

      - name: Push the api module tag
        run: |
          tag="api/${TAG}"
          head=$(git rev-parse HEAD)
          existing=$(git ls-remote --tags origin "refs/tags/${tag}" | cut -f1)
          if [[ -n "${existing}" && "${existing}" != "${head}" ]]; then
            echo "Tag '${tag}' exists and points at ${existing}, not at ${head}." >&2
            exit 1
          fi
          if [[ -z "${existing}" ]]; then
            git tag "${tag}" "${head}"
            git push origin "refs/tags/${tag}"
          fi

      # kubebuilder installs the version of .tool-versions.
      - name: Install kubebuilder
        run: |
          VERSION=$(awk '$1 == "kubebuilder" { print $2 }' .tool-versions)
          OS=$(go env GOOS)
          ARCH=$(go env GOARCH)
          curl -fsSL -o kubebuilder \
            "https://github.com/kubernetes-sigs/kubebuilder/releases/download/v${VERSION}/kubebuilder_${OS}_${ARCH}"
          chmod +x kubebuilder && sudo mv kubebuilder /usr/local/bin/

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.0

      # cosign-installer v4 is the first major that can install cosign v3.
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate the chart and installer manifests
        run: make helm-generate IMG=${IMG} CLI_IMG=${CLI_IMG}

      - name: Stamp the release version into Chart.yaml
        run: |
          sed -i -e "s/^version: .*/version: ${VERSION}/" dist/chart/Chart.yaml
          sed -i -e "s/^appVersion: .*/appVersion: \"${VERSION}\"/" dist/chart/Chart.yaml
          sed -i -e "s|\(image: ghcr.io/konsole-is/camunda-operator\(-cli\)\{0,1\}\):.*|\1:${VERSION}|" dist/chart/Chart.yaml
          grep -E '^(version|appVersion):|image: ' dist/chart/Chart.yaml

      - name: Verify the chart
        run: make helm-verify

      - name: Build and push the operator image
        run: make docker-buildx IMG=${IMG}

      - name: Resolve the image digest
        id: image
        run: |
          digest=$(docker buildx imagetools inspect "${IMG}" \
            --format '{{.Manifest.Digest}}')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "image digest: ${digest}"

      - name: Build and push the CLI image
        run: make docker-buildx-cli CLI_IMG=${CLI_IMG}

      - name: Resolve the CLI image digest
        id: cli
        run: |
          digest=$(docker buildx imagetools inspect "${CLI_IMG}" \
            --format '{{.Manifest.Digest}}')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "cli image digest: ${digest}"

      - name: Package and push the chart
        id: chart
        run: |
          # The default `bash -e {0}` Actions shell does not imply pipefail:
          # `helm push ... | tee` would otherwise swallow a failing push's
          # exit code. Without this, a failed push could leave `digest`
          # empty (caught below) or, worse, matching an unrelated sha256
          # embedded in an error message (e.g. "digest mismatch: expected
          # sha256:...").
          set -o pipefail
          helm package dist/chart --destination dist
          helm push "dist/camunda-operator-${VERSION}.tgz" "${CHART_REGISTRY}" 2>&1 | tee push.log
          # Anchored to the literal "Digest:" line helm emits on success, so
          # a sha256 mentioned incidentally in an error message (digest
          # mismatch, failed manifest push, etc.) can't be mistaken for the
          # real one.
          digest=$(sed -n 's/^Digest:[[:space:]]*\(sha256:[0-9a-f]\{64\}\).*/\1/p' push.log | head -1)
          if [ -z "$digest" ]; then
            echo "Could not parse the chart digest from helm push output." >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "chart digest: ${digest}"

      - name: Install oras
        uses: oras-project/setup-oras@v2.0.2
        with:
          version: 1.3.4

      # Artifact Hub reads the repository metadata from the tag artifacthub.io
      # of the chart repository, with these media types:
      # https://artifacthub.io/docs/topics/repositories/helm-charts/
      - name: Push the Artifact Hub repository metadata
        working-directory: .github
        run: |
          oras push "${CHART_REPO}:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      # Sign by digest, never by tag — tags are mutable.
      - name: Sign the image
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}"

      - name: Sign the CLI image
        run: cosign sign --yes "ghcr.io/${{ github.repository }}-cli@${{ steps.cli.outputs.digest }}"

      - name: Sign the chart
        run: cosign sign --yes "${CHART_REPO}@${{ steps.chart.outputs.digest }}"

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/install.yaml
            dist/crds.yaml
            dist/camunda-operator-${{ env.VERSION }}.tgz

  docs:
    name: Publish the docs site
    needs: release
    # latest documents the newest stable release, so a prerelease leaves the
    # site as it is.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    # The Docs workflow deploys dev in the same group, so two pushes to
    # gh-pages never race.
    concurrency:
      group: gh-pages
      cancel-in-progress: false

    permissions:
      contents: write   # push to gh-pages

    steps:
      - name: Clone the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt

      # One docs version per minor release, such as 0.1, with the alias latest.
      # A patch release replaces the docs of its minor.
      - name: Deploy the release version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          minor=$(echo "${TAG#v}" | cut -d. -f1,2)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mike deploy --push --update-aliases --title "${minor}" "${minor}" latest
          mike set-default --push latest
