apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/managed-by: camunda-operator
    camunda.io/cluster: my-cluster
    camunda.io/component: dump
    camunda.io/logical-backup-rdbms: my-cluster-1748937221000
  name: my-cluster-1748937221000-dump
  namespace: my-cluster-ns
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: camunda-operator
        camunda.io/cluster: my-cluster
        camunda.io/component: dump
        camunda.io/logical-backup-rdbms: my-cluster-1748937221000
    spec:
      containers:
      - args:
        - upload
        env:
        - name: UPLOAD_FILE
          value: /scratch/camunda.dump
        - name: UPLOAD_KEY
          value: clusters/my-cluster-ns/my-cluster/1748937221000/camunda.dump
        - name: UPLOAD_STORAGE_NAME
          value: my-backup-config
        - name: UPLOAD_STORAGE_SPEC
          value: '{"type":"GCS","gcs":{"bucketName":"camunda-backups","basePath":"clusters","auth":{"type":"credentials","credentials":{"secretRef":{"name":"gcs-key","namespace":"camunda","key":"key.json"}}}}}'
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /var/run/secrets/camunda.io/gcs/key.json
        image: ghcr.io/konsole-is/camunda-operator:0.1.0
        name: upload
        resources: {}
        volumeMounts:
        - mountPath: /scratch
          name: scratch
        - mountPath: /var/run/secrets/camunda.io/gcs
          name: gcs-key
          readOnly: true
      initContainers:
      - command:
        - pg_dump
        - --format=custom
        - --no-password
        - --file=/scratch/camunda.dump
        env:
        - name: PGHOST
          value: postgres.databases.svc
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: camunda
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              key: username
              name: my-cluster-1748937221000-dump-credentials
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: my-cluster-1748937221000-dump-credentials
        image: postgres:17
        name: dump
        resources: {}
        volumeMounts:
        - mountPath: /scratch
          name: scratch
      restartPolicy: Never
      serviceAccountName: my-cluster-camunda
      volumes:
      - emptyDir: {}
        name: scratch
      - name: gcs-key
        secret:
          secretName: my-cluster-camunda-backup-credentials
