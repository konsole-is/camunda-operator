apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/managed-by: camunda-operator
    camunda.io/cluster: my-cluster
    camunda.io/component: dump
    camunda.io/logical-backup-rdbms: my-cluster-1748937221000
    camunda.io/logical-backup-rdbms-uid: 3f2a9c1e-7b4d-4e0a-9c6f-2d1b8a5e4c73
  name: my-cluster-ns-my-cluster-1748937221000-dump
  namespace: my-cluster-ns
spec:
  backoffLimit: 3
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/managed-by: camunda-operator
        camunda.io/cluster: my-cluster
        camunda.io/component: dump
        camunda.io/logical-backup-rdbms: my-cluster-1748937221000
        camunda.io/logical-backup-rdbms-uid: 3f2a9c1e-7b4d-4e0a-9c6f-2d1b8a5e4c73
        team: data
    spec:
      containers:
      - args:
        - upload
        env:
        - name: UPLOAD_FILE
          value: /scratch/camunda.dump
        - name: UPLOAD_KEY
          value: clusters/my-cluster-ns/my-cluster/1748937221000/camunda.dump
        - name: UPLOAD_STORAGE_NAME
          value: my-backup-config
        - name: UPLOAD_STORAGE_SPEC
          value: '{"type":"S3","s3":{"bucketName":"camunda-backups","basePath":"clusters","region":"eu-west-1","endpoint":"http://minio.minio.svc:9000","auth":{"type":"credentials","credentials":{"secretRef":{"name":"minio-credentials","namespace":"camunda","accessKeyIdKey":"accessKeyId","secretAccessKeyKey":"secretAccessKey"}}}}}'
        - name: UPLOAD_CREDENTIAL_KEYS
          value: accessKeyId,secretAccessKey
        - name: UPLOAD_CREDENTIAL_0
          valueFrom:
            secretKeyRef:
              key: accessKeyId
              name: my-cluster-camunda-backup-credentials
        - name: UPLOAD_CREDENTIAL_1
          valueFrom:
            secretKeyRef:
              key: secretAccessKey
              name: my-cluster-camunda-backup-credentials
        - name: PGSSLMODE
          value: require
        image: ghcr.io/konsole-is/camunda-operator-cli:0.1.0
        name: upload
        resources:
          requests:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
        volumeMounts:
        - mountPath: /scratch
          name: scratch
      initContainers:
      - command:
        - pg_dump
        - --format=custom
        - --no-password
        - --file=/scratch/camunda.dump
        env:
        - name: PGHOST
          value: postgres.databases.svc
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: camunda
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              key: username
              name: my-cluster-camunda-dump-credentials
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: my-cluster-camunda-dump-credentials
        - name: PGSSLMODE
          value: require
        image: postgres:17
        name: dump
        resources:
          requests:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 999
          runAsNonRoot: true
          runAsUser: 999
        volumeMounts:
        - mountPath: /scratch
          name: scratch
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: my-cluster-camunda
      tolerations:
      - key: backups
        operator: Exists
      volumes:
      - emptyDir:
          sizeLimit: 50Gi
        name: scratch
