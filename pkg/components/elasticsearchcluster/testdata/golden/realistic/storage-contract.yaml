apiVersion: core.camunda.io/v1
kind: SecondaryStorageConfig
metadata:
  labels:
    app.kubernetes.io/managed-by: camunda-operator
    camunda.io/component: elasticsearch
    camunda.io/elasticsearch-cluster: my-cluster-es
  name: my-storage-config
  namespace: my-cluster-ns
spec:
  elasticsearch:
    caSecretRef:
      key: ca.crt
      name: my-cluster-es-es-http-certs-public
    credentialsSecretRef:
      name: my-cluster-es-es-user
      passwordKey: password
      usernameKey: username
    endpoint: https://my-cluster-es-es-http.my-cluster-ns.svc:9200
  type: elasticsearch
