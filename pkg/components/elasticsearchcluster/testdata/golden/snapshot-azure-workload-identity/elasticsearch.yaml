apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000
  labels:
    app.kubernetes.io/managed-by: camunda-operator
    camunda.io/component: elasticsearch
    camunda.io/elasticsearch-cluster: my-cluster-es
  name: my-cluster-es-es
  namespace: my-cluster-ns
---
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  labels:
    app.kubernetes.io/managed-by: camunda-operator
    camunda.io/component: elasticsearch
    camunda.io/elasticsearch-cluster: my-cluster-es
  name: my-cluster-es
  namespace: my-cluster-ns
spec:
  auth:
    fileRealm:
    - secretName: my-cluster-es-es-user
    roles:
    - secretName: my-cluster-es-es-roles
  http:
    service:
      metadata: {}
      spec: {}
    tls:
      certificate: {}
      client: {}
  monitoring:
    logs: {}
    metrics: {}
  nodeSets:
  - count: 3
    name: default
    podTemplate:
      metadata:
        labels:
          azure.workload.identity/use: "true"
          camunda.io/component: elasticsearch
          camunda.io/elasticsearch-cluster: my-cluster-es
      spec:
        containers:
        - env:
          - name: AZURE_FEDERATED_TOKEN_FILE
            value: /usr/share/elasticsearch/config/azure/tokens/azure-identity-token
          name: elasticsearch
          resources: {}
          volumeMounts:
          - mountPath: /usr/share/elasticsearch/config/azure/tokens
            name: azure-identity-token
        serviceAccountName: my-cluster-es-es
        volumes:
        - name: azure-identity-token
          projected:
            sources:
            - serviceAccountToken:
                audience: api://AzureADTokenExchange
                expirationSeconds: 3600
                path: azure-identity-token
    volumeClaimTemplates:
    - metadata:
        labels:
          camunda.io/component: elasticsearch
          camunda.io/elasticsearch-cluster: my-cluster-es
        name: elasticsearch-data
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 64Gi
      status: {}
  remoteClusterServer:
    service:
      metadata: {}
      spec: {}
  secureSettings:
  - secretName: my-cluster-es-es-snapshot-keystore
  transport:
    service:
      metadata: {}
      spec: {}
    tls:
      certificate: {}
      certificateAuthorities: {}
  updateStrategy:
    changeBudget: {}
  version: 9.2.4
  volumeClaimDeletePolicy: DeleteOnScaledownAndClusterDeletion
status:
  conditions: null
  inProgressOperations:
    downscale:
      lastUpdatedTime: null
    upgrade:
      lastUpdatedTime: null
    upscale:
      lastUpdatedTime: null
