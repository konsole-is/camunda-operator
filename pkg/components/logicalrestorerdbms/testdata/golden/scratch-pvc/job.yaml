apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/managed-by: camunda-operator
    camunda.io/cluster: my-cluster
    camunda.io/component: pg-restore
    camunda.io/logical-restore-rdbms: my-cluster-restore
    camunda.io/logical-restore-rdbms-uid: 9d4c1f77-2b3e-4a58-8c0d-7e5f6a1b2c34
  name: my-cluster-restore-pg-restore
  namespace: my-cluster-ns
spec:
  activeDeadlineSeconds: 86400
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: camunda-operator
        camunda.io/cluster: my-cluster
        camunda.io/component: pg-restore
        camunda.io/logical-restore-rdbms: my-cluster-restore
        camunda.io/logical-restore-rdbms-uid: 9d4c1f77-2b3e-4a58-8c0d-7e5f6a1b2c34
        camunda.io/storage-claim: camunda-storage-0123456789abcdef0123456789abcdef01234567
    spec:
      containers:
      - command:
        - pg_restore
        - --clean
        - --if-exists
        - --no-owner
        - --dbname=camunda
        - /scratch/camunda.dump
        env:
        - name: PGHOST
          value: postgres.databases.svc
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: camunda
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              key: username
              name: my-cluster-camunda-db-credentials
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: my-cluster-camunda-db-credentials
        image: postgres:17
        name: restore
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 999
          runAsNonRoot: true
          runAsUser: 999
        volumeMounts:
        - mountPath: /scratch
          name: scratch
      initContainers:
      - args:
        - download
        env:
        - name: DOWNLOAD_FILE
          value: /scratch/camunda.dump
        - name: DOWNLOAD_KEY
          value: clusters/my-cluster-ns/my-cluster/1748937221000/2c8b0e6e-5f0a-4c25-9d5b-4d1d0f4b1a10/camunda.dump
        - name: UPLOAD_STORAGE_NAME
          value: my-backup-config
        - name: UPLOAD_STORAGE_SPEC
          value: '{"type":"S3","s3":{"bucketName":"camunda-backups","basePath":"clusters","region":"eu-west-1","endpoint":"http://minio.minio.svc:9000","auth":{"type":"credentials","credentials":{"secretRef":{"name":"minio-credentials","accessKeyIdKey":"accessKeyId","secretAccessKeyKey":"secretAccessKey"}}}}}'
        - name: UPLOAD_CREDENTIAL_KEYS
          value: accessKeyId,secretAccessKey
        - name: UPLOAD_CREDENTIAL_0
          valueFrom:
            secretKeyRef:
              key: accessKeyId
              name: my-cluster-camunda-backup-credentials
        - name: UPLOAD_CREDENTIAL_1
          valueFrom:
            secretKeyRef:
              key: secretAccessKey
              name: my-cluster-camunda-backup-credentials
        image: ghcr.io/konsole-is/camunda-operator-cli:0.1.0
        name: download
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
        volumeMounts:
        - mountPath: /scratch
          name: scratch
      - command:
        - psql
        - --no-psqlrc
        - --set=ON_ERROR_STOP=1
        - |-
          --command=DO $$
          DECLARE
            r record;
          BEGIN
            FOR r IN
              SELECT c.relkind, n.nspname, c.relname
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE pg_get_userbyid(c.relowner) = current_user
                AND c.relkind IN ('r', 'p', 'v', 'm', 'S', 'f')
                AND n.nspname <> 'information_schema'
                AND n.nspname NOT LIKE 'pg\_%'
                AND NOT EXISTS (
                  SELECT FROM pg_depend d
                  WHERE d.classid = 'pg_class'::regclass
                    AND d.objid = c.oid
                    AND d.deptype IN ('a', 'i', 'e')
                )
              ORDER BY n.nspname, c.relname
            LOOP
              EXECUTE format(
                'DROP %s IF EXISTS %I.%I CASCADE',
                CASE r.relkind
                  WHEN 'v' THEN 'VIEW'
                  WHEN 'm' THEN 'MATERIALIZED VIEW'
                  WHEN 'S' THEN 'SEQUENCE'
                  WHEN 'f' THEN 'FOREIGN TABLE'
                  ELSE 'TABLE'
                END,
                r.nspname,
                r.relname
              );
            END LOOP;
          END
          $$
        env:
        - name: PGHOST
          value: postgres.databases.svc
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: camunda
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              key: username
              name: my-cluster-camunda-db-credentials
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: my-cluster-camunda-db-credentials
        image: postgres:17
        name: drop
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 999
          runAsNonRoot: true
          runAsUser: 999
      restartPolicy: Never
      securityContext:
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: my-cluster-camunda
      volumes:
      - ephemeral:
          volumeClaimTemplate:
            metadata: {}
            spec:
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 200Gi
              storageClassName: fast
        name: scratch
