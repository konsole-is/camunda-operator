apiVersion: plugins.camunda.io/v1alpha1
kind: PluginRequest
metadata:
  labels:
    fleet.camunda.io/claim: orders
    plugins.camunda.io/registration: test-identity
    plugins.camunda.io/section: cloud-identity
  name: orders-cloud-identity
  namespace: team-a
spec:
  claimRef:
    kind: CamundaClusterClaim
    name: orders
  deletionPolicy: Delete
  registration: test-identity
  section: cloud-identity
  target:
    additionalServiceAccounts:
    - orders-es-es
    kind: CamundaCluster
    name: orders
    serviceAccountName: orders-camunda
