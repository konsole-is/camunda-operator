apiVersion: v1
data:
  credentials.json: eyJ0eXBlIjoic2VydmljZV9hY2NvdW50IiwicHJvamVjdF9pZCI6ImNhbXVuZGEifQ==
kind: Secret
metadata:
  labels:
    app.kubernetes.io/managed-by: camunda-operator
    camunda.io/component: postgres
    camunda.io/database-server: my-cluster-db
  name: my-cluster-db-archive
  namespace: my-cluster-ns
type: Opaque
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  labels:
    app.kubernetes.io/managed-by: camunda-operator
    camunda.io/component: postgres
    camunda.io/database-server: my-cluster-db
  name: my-cluster-db
  namespace: my-cluster-ns
spec:
  configuration:
    data:
      compression: gzip
    destinationPath: gs://camunda-backups/clusters/databaseserver/my-cluster-ns/my-cluster-db-eec0942b
    googleCredentials:
      applicationCredentials:
        key: credentials.json
        name: my-cluster-db-archive
    wal:
      compression: gzip
  retentionPolicy: 30d
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  labels:
    app.kubernetes.io/managed-by: camunda-operator
    camunda.io/component: postgres
    camunda.io/database-server: my-cluster-db
  name: my-cluster-db
  namespace: my-cluster-ns
spec:
  cluster:
    name: my-cluster-db
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  schedule: 0 0 2 * * *
  suspend: false
