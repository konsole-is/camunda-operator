apiVersion: core.camunda.io/v1
kind: DatabaseServerConfig
metadata:
  labels:
    app.kubernetes.io/managed-by: camunda-operator
    camunda.io/component: postgres
    camunda.io/database-server: my-cluster-db
  name: my-database-server
  namespace: my-cluster-ns
spec:
  adminCredentialsSecretRef:
    name: my-cluster-db-superuser
    passwordKey: password
    usernameKey: username
  engine: postgres
  host: my-cluster-db-rw.my-cluster-ns.svc
  pitr:
    enabled: true
    recovery: operator
    retentionPeriodDays: 30
    windows:
    - from: "2026-10-01T02:00:00Z"
      location: azblob://camundabackups/archive/clusters/databaseserver/my-cluster-ns/my-cluster-db-eec0942b
        (endpoint https://camundabackups.blob.core.windows.net)
      to: "2026-10-20T09:30:00Z"
    - from: "2026-10-20T10:00:00Z"
      lag: 6m0s
      location: azblob://camundabackups/archive/clusters/databaseserver/my-cluster-ns/my-cluster-db-eec0942b
        (endpoint https://camundabackups.blob.core.windows.net)
  port: 5432
