apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/camunda
  labels:
    app.kubernetes.io/managed-by: camunda-operator
    camunda.io/component: postgres
    camunda.io/database-server: my-cluster-db
  name: my-cluster-db-postgres
  namespace: my-cluster-ns
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    camunda.io/requested-storage-size: 64Gi
    camunda.io/requested-wal-storage-size: ""
    cnpg.io/hibernation: "off"
  labels:
    app.kubernetes.io/managed-by: camunda-operator
    camunda.io/component: postgres
    camunda.io/database-server: my-cluster-db
  name: my-cluster-db
  namespace: my-cluster-ns
spec:
  affinity: {}
  enableSuperuserAccess: true
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  inheritedMetadata:
    labels:
      camunda.io/component: postgres
      camunda.io/database-server: my-cluster-db
  instances: 2
  plugins:
  - isWALArchiver: true
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: my-cluster-db
      serverName: my-cluster-db
  postgresql:
    syncReplicaElectionConstraint:
      enabled: false
  resources: {}
  serviceAccountName: my-cluster-db-postgres
  storage:
    size: 64Gi
status:
  certificates: {}
  configMapResourceVersion: {}
  managedRolesStatus: {}
  secretsResourceVersion: {}
  switchReplicaClusterStatus: {}
  topology: {}
