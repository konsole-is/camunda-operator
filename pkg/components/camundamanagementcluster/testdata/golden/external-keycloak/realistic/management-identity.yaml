apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: camunda-operator
    camunda.io/component: management-identity
    camunda.io/management-cluster: my-management
  name: my-management-identity
  namespace: camunda
spec:
  replicas: 1
  selector:
    matchLabels:
      camunda.io/component: management-identity
      camunda.io/management-cluster: my-management
  strategy: {}
  template:
    metadata:
      annotations:
        camunda.io/config-hash: 9d729c8cb9134327
      labels:
        camunda.io/component: management-identity
        camunda.io/management-cluster: my-management
    spec:
      containers:
      - env:
        - name: SPRING_PROFILES_ACTIVE
          value: keycloak
        - name: CAMUNDA_IDENTITY_TYPE
          value: KEYCLOAK
        - name: CAMUNDA_IDENTITY_AUDIENCE
          value: camunda-identity-resource-server
        - name: KEYCLOAK_URL
          value: https://keycloak.example.com/auth
        - name: KEYCLOAK_REALM
          value: camunda-platform
        - name: IDENTITY_AUTH_PROVIDER_ISSUER_URL
          value: https://keycloak.example.com/auth/realms/camunda-platform
        - name: IDENTITY_AUTH_PROVIDER_BACKEND_URL
          value: https://keycloak.example.com/auth/realms/camunda-platform
        - name: IDENTITY_CLIENT_ID
          value: camunda-identity
        - name: KEYCLOAK_SETUP_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: my-management-management-keycloak-admin
        - name: KEYCLOAK_SETUP_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: my-management-management-keycloak-admin
        - name: KEYCLOAK_SETUP_REALM
          value: master
        - name: KEYCLOAK_SETUP_CLIENT_ID
          value: admin-cli
        - name: KEYCLOAK_INIT_OPTIMIZE_ROOT_URL
          value: https://optimize.example.com
        - name: KEYCLOAK_INIT_OPTIMIZE_SECRET
          valueFrom:
            secretKeyRef:
              key: client-secret
              name: my-management-optimize-client
        - name: KEYCLOAK_USERS_0_USERNAME
          value: platform-admin
        - name: KEYCLOAK_USERS_0_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: admin-password
        - name: KEYCLOAK_USERS_0_EMAIL
          value: admin@example.com
        - name: KEYCLOAK_USERS_0_ROLES_0
          value: ManagementIdentity
        - name: KEYCLOAK_USERS_0_ROLES_1
          value: Optimize
        - name: IDENTITY_URL
          value: https://identity.example.com
        - name: IDENTITY_DATABASE_HOST
          value: postgres.camunda.svc
        - name: IDENTITY_DATABASE_PORT
          value: "5432"
        - name: IDENTITY_DATABASE_NAME
          value: identity
        - name: IDENTITY_DATABASE_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: identity-db-credentials
        - name: IDENTITY_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: identity-db-credentials
        - name: CAMUNDA_LICENSE_KEY
          valueFrom:
            secretKeyRef:
              key: license
              name: my-management-management-license
        image: registry.example.com/mirror/camunda/identity:8.9.4
        name: identity
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 8082
          name: management
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: management
          periodSeconds: 10
        resources: {}
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /actuator/health
            port: management
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: camunda-operator
    camunda.io/component: management-identity
    camunda.io/management-cluster: my-management
  name: my-management-identity
  namespace: camunda
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  - name: management
    port: 82
    protocol: TCP
    targetPort: management
  selector:
    camunda.io/component: management-identity
    camunda.io/management-cluster: my-management
status:
  loadBalancer: {}
