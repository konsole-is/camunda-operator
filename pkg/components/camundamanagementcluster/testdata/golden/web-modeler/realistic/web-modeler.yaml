        - name: RESTAPI_PUSHER_APP_ID
          value: web-modeler
        - name: RESTAPI_PUSHER_KEY
          valueFrom:
            secretKeyRef:
              key: app-key
              name: my-management-web-modeler-pusher
        - name: RESTAPI_PUSHER_SECRET
          valueFrom:
            secretKeyRef:
              key: app-secret
              name: my-management-web-modeler-pusher
        - name: CLIENT_PUSHER_HOST
          value: modeler.example.com
        - name: CLIENT_PUSHER_PORT
          value: "443"
        - name: CLIENT_PUSHER_PATH
          value: /modeler-ws
        - name: CLIENT_PUSHER_FORCE_TLS
          value: "true"
        - name: CAMUNDA_MODELER_CLUSTERS_0_ID
          value: 11111111-2222-3333-4444-555555555555
        - name: CAMUNDA_MODELER_CLUSTERS_0_NAME
          value: prod-ns/prod
        - name: CAMUNDA_MODELER_CLUSTERS_0_VERSION
          value: 8.9.9
        - name: CAMUNDA_MODELER_CLUSTERS_0_AUTHENTICATION
          value: BEARER_TOKEN
        - name: CAMUNDA_MODELER_CLUSTERS_0_URL_GRPC
          value: grpc://prod-gateway.prod-ns.svc:26500
        - name: CAMUNDA_MODELER_CLUSTERS_0_URL_REST
          value: http://prod-gateway.prod-ns.svc:8080
        - name: CAMUNDA_MODELER_CLUSTERS_0_AUTHORIZATIONS_ENABLED
          value: "true"
        - name: CAMUNDA_MODELER_CLUSTERS_0_URL_WEBAPP
          value: https://prod.example.com
        - name: CAMUNDA_MODELER_CLUSTERS_1_ID
          value: 66666666-7777-8888-9999-000000000000
        - name: CAMUNDA_MODELER_CLUSTERS_1_NAME
          value: staging-ns/staging
