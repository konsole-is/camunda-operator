apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: camunda-operator
    camunda.io/component: web-modeler-restapi
    camunda.io/management-cluster: my-management
  name: my-management-web-modeler-restapi
  namespace: camunda
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  - name: management
    port: 8091
    protocol: TCP
    targetPort: management
  selector:
    camunda.io/component: web-modeler-restapi
    camunda.io/management-cluster: my-management
status:
  loadBalancer: {}
---
