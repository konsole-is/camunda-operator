apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: camunda-operator
    camunda.io/component: management-identity
    camunda.io/management-cluster: my-management
  name: my-management-identity
  namespace: camunda
spec:
  replicas: 1
  selector:
    matchLabels:
      camunda.io/component: management-identity
      camunda.io/management-cluster: my-management
  strategy: {}
  template:
    metadata:
      annotations:
        camunda.io/config-hash: f80c355675d6a241
      labels:
        camunda.io/component: management-identity
        camunda.io/management-cluster: my-management
    spec:
      containers:
      - env:
        - name: SPRING_PROFILES_ACTIVE
          value: oidc
        - name: CAMUNDA_IDENTITY_TYPE
          value: GENERIC
        - name: CAMUNDA_IDENTITY_BASE_URL
          value: https://identity.example.com
        - name: CAMUNDA_IDENTITY_ISSUER
          value: https://login.example.com
        - name: CAMUNDA_IDENTITY_ISSUER_BACKEND_URL
          value: https://login.example.com
        - name: CAMUNDA_IDENTITY_CLIENT_ID
          value: management-identity
        - name: CAMUNDA_IDENTITY_AUDIENCE
          value: management-identity-api
        - name: CAMUNDA_IDENTITY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: identity-client-secret
              name: oidc-credentials
        - name: CAMUNDA_IDENTITY_USERNAMECLAIM
          value: preferred_username
        - name: IDENTITY_INITIAL_CLAIM_NAME
          value: oid
        - name: IDENTITY_INITIAL_CLAIM_VALUE
          value: admin-oid
        - name: IDENTITY_URL
          value: https://identity.example.com
        - name: IDENTITY_DATABASE_HOST
          value: postgres.camunda.svc
        - name: IDENTITY_DATABASE_PORT
          value: "5432"
        - name: IDENTITY_DATABASE_NAME
          value: identity
        - name: IDENTITY_DATABASE_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: identity-db-credentials
        - name: IDENTITY_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: identity-db-credentials
        image: camunda/identity:8.9.4
        name: identity
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 8082
          name: management
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: management
          periodSeconds: 10
        resources: {}
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /actuator/health
            port: management
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: camunda-operator
    camunda.io/component: management-identity
    camunda.io/management-cluster: my-management
  name: my-management-identity
  namespace: camunda
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  - name: management
    port: 82
    protocol: TCP
    targetPort: management
  selector:
    camunda.io/component: management-identity
    camunda.io/management-cluster: my-management
status:
  loadBalancer: {}
