apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: camunda-operator
    camunda.io/cluster: my-cluster
    camunda.io/component: gateway
  name: my-cluster-gateway
  namespace: my-cluster-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      camunda.io/cluster: my-cluster
      camunda.io/component: gateway
  strategy:
    type: RollingUpdate
  template:
    metadata:
      annotations:
        camunda.io/config-hash: 4cd9858bd51bb9b4
        company.com/cluster-preset: medium
      labels:
        camunda.io/cluster: my-cluster
        camunda.io/component: gateway
        camunda.io/storage-contract: my-storage-config
        company.com/team: automation-ops
        team: platform
    spec:
      containers:
      - env:
        - name: CAMUNDA_CLUSTER_NAME
          value: my-cluster
        - name: CAMUNDA_CLUSTER_SIZE
          value: "3"
        - name: CAMUNDA_CLUSTER_PARTITIONCOUNT
          value: "3"
        - name: CAMUNDA_CLUSTER_REPLICATIONFACTOR
          value: "3"
        - name: CAMUNDA_CLUSTER_INITIALCONTACTPOINTS
          value: my-cluster-zeebe-0.my-cluster-zeebe.my-cluster-ns.svc:26502,my-cluster-zeebe-1.my-cluster-zeebe.my-cluster-ns.svc:26502,my-cluster-zeebe-2.my-cluster-zeebe.my-cluster-ns.svc:26502
        - name: CAMUNDA_API_GRPC_ADDRESS
          value: 0.0.0.0
        - name: CAMUNDA_CLUSTER_GATEWAYID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: CAMUNDA_DATA_SECONDARYSTORAGE_TYPE
          value: elasticsearch
        - name: CAMUNDA_DATA_SECONDARYSTORAGE_ELASTICSEARCH_URL
          value: https://es-http.my-cluster-ns.svc:9200
        - name: CAMUNDA_DATA_SECONDARYSTORAGE_ELASTICSEARCH_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: es-user
        - name: CAMUNDA_DATA_SECONDARYSTORAGE_ELASTICSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: es-user
        - name: CAMUNDA_DATA_SECONDARYSTORAGE_ELASTICSEARCH_SECURITY_ENABLED
          value: "true"
        - name: CAMUNDA_DATA_SECONDARYSTORAGE_ELASTICSEARCH_SECURITY_CERTIFICATEPATH
          value: /etc/camunda/es-ca/ca.crt
        - name: CAMUNDA_DATA_SECONDARYSTORAGE_ELASTICSEARCH_SECURITY_VERIFYHOSTNAME
          value: "true"
        - name: CAMUNDA_DATA_SECONDARYSTORAGE_ELASTICSEARCH_SECURITY_SELFSIGNED
          value: "false"
        - name: CAMUNDA_SECURITY_AUTHENTICATION_METHOD
          value: basic
        - name: CAMUNDA_SECURITY_INITIALIZATION_USERS_0_USERNAME
          value: admin
        - name: CAMUNDA_SECURITY_INITIALIZATION_USERS_0_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: my-cluster-camunda-admin
        - name: CAMUNDA_SECURITY_INITIALIZATION_USERS_0_NAME
          value: admin
        - name: CAMUNDA_SECURITY_INITIALIZATION_USERS_0_EMAIL
          valueFrom:
            secretKeyRef:
              key: email
              name: my-cluster-camunda-admin
        - name: CAMUNDA_SECURITY_INITIALIZATION_DEFAULTROLES_ADMIN_USERS_0
          value: admin
        - name: CAMUNDA_LICENSE_KEY
          valueFrom:
            secretKeyRef:
              key: key
              name: camunda-license
        - name: SPRING_PROFILES_ACTIVE
          value: admin,consolidated-auth,gateway,operate,tasklist
        - name: JAVA_TOOL_OPTIONS
          value: -XX:+ExitOnOutOfMemoryError -Djavax.net.ssl.trustStore=/etc/camunda/es-truststore/cacerts
            -Djavax.net.ssl.trustStorePassword=changeit
        - name: TZ
          value: UTC
        envFrom:
        - configMapRef:
            name: overrides
        image: registry.example.com/camunda/camunda:8.9.9
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: management
          periodSeconds: 30
        name: camunda
        ports:
        - containerPort: 26500
          name: grpc
          protocol: TCP
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 9600
          name: management
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: management
          periodSeconds: 10
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /actuator/health/startup
            port: management
          periodSeconds: 5
        volumeMounts:
        - mountPath: /etc/camunda/es-ca
          name: es-ca
          readOnly: true
        - mountPath: /etc/camunda/es-truststore
          name: es-truststore
          readOnly: true
      initContainers:
      - command:
        - sh
        - -c
        - "set -eu\numask 022\nhome=\"${JAVA_HOME:-$(dirname \"$(dirname \"$(readlink
          -f \"$(command -v keytool)\")\")\")}\"\ncp -L \"$home/lib/security/cacerts\"
          \"$TRUST_STORE_FILE\"\nchmod 0644 \"$TRUST_STORE_FILE\"\nsingle=\"$(dirname
          \"$TRUST_STORE_FILE\")/certificate.pem\"\ncount=0\nblock=\"\"\nwhile IFS=
          read -r line || [ -n \"$line\" ]; do\n\tblock=\"$block$line\n\"\n\tcase
          \"$line\" in\n\t*\"END CERTIFICATE\"*)\n\t\tcount=$((count + 1))\n\t\tprintf
          '%s' \"$block\" > \"$single\"\n\t\tblock=\"\"\n\t\t\"$home/bin/keytool\"
          -importcert -noprompt -trustcacerts \\\n\t\t\t-keystore \"$TRUST_STORE_FILE\"
          -storepass \"$TRUST_STORE_PASSWORD\" \\\n\t\t\t-alias \"camunda-es-ca-$count\"
          -file \"$single\"\n\t\t;;\n\tesac\ndone < \"$TRUST_STORE_SOURCE\"\nrm -f
          \"$single\"\nif [ \"$count\" -eq 0 ]; then\n\techo \"no certificate in $TRUST_STORE_SOURCE\"
          >&2\n\texit 1\nfi\n"
        env:
        - name: TRUST_STORE_SOURCE
          value: /etc/camunda/es-ca/ca.crt
        - name: TRUST_STORE_FILE
          value: /etc/camunda/es-truststore/cacerts
        - name: TRUST_STORE_PASSWORD
          value: changeit
        image: registry.example.com/camunda/camunda:8.9.9
        name: es-truststore
        resources: {}
        volumeMounts:
        - mountPath: /etc/camunda/es-ca
          name: es-ca
          readOnly: true
        - mountPath: /etc/camunda/es-truststore
          name: es-truststore
      securityContext:
        fsGroup: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
      serviceAccountName: my-cluster-camunda
      volumes:
      - name: es-ca
        secret:
          items:
          - key: ca.crt
            path: ca.crt
          secretName: my-cluster-es-es-http-certs-public
      - emptyDir: {}
        name: es-truststore
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: camunda-operator
    camunda.io/cluster: my-cluster
    camunda.io/component: gateway
  name: my-cluster-gateway
  namespace: my-cluster-ns
spec:
  ports:
  - name: grpc
    port: 26500
    protocol: TCP
    targetPort: grpc
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
  - name: management
    port: 9600
    protocol: TCP
    targetPort: management
  selector:
    camunda.io/cluster: my-cluster
    camunda.io/component: gateway
status:
  loadBalancer: {}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/managed-by: camunda-operator
    camunda.io/cluster: my-cluster
    camunda.io/component: gateway
    release: prometheus
  name: my-cluster-gateway
  namespace: my-cluster-ns
spec:
  endpoints:
  - path: /actuator/prometheus
    port: management
  namespaceSelector: {}
  selector:
    matchLabels:
      camunda.io/cluster: my-cluster
      camunda.io/component: gateway
