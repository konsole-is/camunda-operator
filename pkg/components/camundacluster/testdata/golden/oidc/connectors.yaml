apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: camunda-operator
    camunda.io/cluster: my-cluster
    camunda.io/component: connectors
  name: my-cluster-connectors
  namespace: my-cluster-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      camunda.io/cluster: my-cluster
      camunda.io/component: connectors
  strategy:
    type: RollingUpdate
  template:
    metadata:
      annotations:
        camunda.io/config-hash: 3f0d64b7a1f18481
      labels:
        camunda.io/cluster: my-cluster
        camunda.io/component: connectors
    spec:
      containers:
      - env:
        - name: CAMUNDA_CLIENT_MODE
          value: selfManaged
        - name: CAMUNDA_CLIENT_GRPCADDRESS
          value: http://my-cluster-gateway.my-cluster-ns.svc:26500
        - name: CAMUNDA_CLIENT_RESTADDRESS
          value: http://my-cluster-gateway.my-cluster-ns.svc:8080
        - name: CAMUNDA_CLIENT_AUTH_METHOD
          value: oidc
        - name: CAMUNDA_CLIENT_AUTH_CLIENTID
          value: my-cluster-client
        - name: CAMUNDA_CLIENT_AUTH_CLIENTSECRET
          valueFrom:
            secretKeyRef:
              key: client-secret
              name: my-cluster-oidc-secret
        - name: CAMUNDA_CLIENT_AUTH_ISSUERURL
          value: https://idp.example.com/realms/camunda
        - name: CAMUNDA_CLIENT_AUTH_AUDIENCE
          value: my-cluster-client
        image: camunda/connectors-bundle:8.9.7
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 30
        name: connectors
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          periodSeconds: 10
        resources: {}
      securityContext:
        fsGroup: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: camunda-operator
    camunda.io/cluster: my-cluster
    camunda.io/component: connectors
  name: my-cluster-connectors
  namespace: my-cluster-ns
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
  selector:
    camunda.io/cluster: my-cluster
    camunda.io/component: connectors
status:
  loadBalancer: {}
