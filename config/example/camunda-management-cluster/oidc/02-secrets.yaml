# CAUTION: Replace every placeholder value before you apply this file. The
# values below are not valid credentials.
#
# Create one client in your identity provider for each Secret here, then copy
# its client secret into the Secret. The Console client and the Web Modeler
# client are public, so they have no secret and no file here.
#
# The guide keeps these Secrets in a shared namespace such as camunda-system.
# This inventory keeps them beside the management plane, so that one apply
# creates everything it references.
apiVersion: v1
kind: Secret
metadata:
  name: my-oidc-credentials
  namespace: my-management-ns
type: Opaque
stringData:
  client-secret: "<the secret of the camunda-orchestration client>"
---
apiVersion: v1
kind: Secret
metadata:
  name: my-management-identity-credentials
  namespace: my-management-ns
type: Opaque
stringData:
  client-secret: "<the secret of the camunda-identity client>"
---
apiVersion: v1
kind: Secret
metadata:
  name: my-optimize-credentials
  namespace: my-management-ns
type: Opaque
stringData:
  client-secret: "<the secret of the camunda-optimize client>"
---
apiVersion: v1
kind: Secret
metadata:
  name: my-web-modeler-api-credentials
  namespace: my-management-ns
type: Opaque
stringData:
  client-secret: "<the secret of the camunda-web-modeler-api client>"
---
apiVersion: v1
kind: Secret
metadata:
  name: my-smtp-credentials
  namespace: my-management-ns
type: Opaque
stringData:
  username: "<the SMTP user of Web Modeler>"
  password: "<the SMTP password of Web Modeler>"
