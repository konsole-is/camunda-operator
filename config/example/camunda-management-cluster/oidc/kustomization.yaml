# The resources are listed in the order the README applies them. Do not add a
# namespace transformer here: CamundaPlatformConfig is cluster scoped, and a
# transformer would stamp a namespace on it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- 01-namespace.yaml
- 02-secrets.yaml
- 03-database-server.yaml
- 04-databases.yaml
- 05-platform-config.yaml
- 06-management-cluster.yaml
