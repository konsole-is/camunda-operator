# Each Database publishes a DatabaseConfig of its own name, which the
# management cluster names in a databaseConfigRef. databaseName takes
# lowercase letters and underscores only, so Web Modeler gets web_modeler.
apiVersion: core.camunda.io/v1
kind: Database
metadata:
  name: my-identity-db
  namespace: my-management-ns
spec:
  serverRef: my-db-server
  databaseName: identity
---
apiVersion: core.camunda.io/v1
kind: Database
metadata:
  name: my-web-modeler-db
  namespace: my-management-ns
spec:
  serverRef: my-db-server
  databaseName: web_modeler
