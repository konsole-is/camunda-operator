# The orchestration cluster that the management plane serves. The label
# environment: production is what the clusterSelector of my-management
# matches. Without it the management plane leaves this cluster alone.
#
# presetRef names the shared CamundaClusterPreset small, and releaseRef names
# the shared CamundaRelease camunda-8-9. One preset serves every cluster of
# this shape, and one release serves every cluster on this version. A second
# cluster is this manifest again with another name.
#
# spec.version is unset, so the cluster runs the version of the release.
apiVersion: core.camunda.io/v1
kind: CamundaCluster
metadata:
  name: my-cluster
  namespace: my-cluster-ns
  labels:
    environment: production
spec:
  presetRef: small
  releaseRef: camunda-8-9
  platformConfigRef: my-platform-config
  storageRef: my-storage-config
  externalUrl: "https://my-cluster.camunda.example.com"
