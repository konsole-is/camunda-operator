# The PostgreSQL server for the management plane. The operator publishes the
# DatabaseServerConfig my-db-server from it. Keycloak, Management Identity,
# and Web Modeler each get a logical database on this server.
#
# presetRef names the shared DatabaseServerPreset standard, and releaseRef the
# shared CamundaRelease camunda-8-9, which carries the PostgreSQL version.
apiVersion: core.camunda.io/v1
kind: DatabaseServer
metadata:
  name: my-db
  namespace: my-management-ns
spec:
  presetRef: standard
  releaseRef: camunda-8-9
  databaseServerConfig: my-db-server
