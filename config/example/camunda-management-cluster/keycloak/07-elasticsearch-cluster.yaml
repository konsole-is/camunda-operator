# Optimize reads the secondary storage of the cluster it attaches to, and it
# reads Elasticsearch only. A cluster on a relational database reports
# StorageTypeMismatch on its CamundaOptimize.
#
# presetRef names the shared ElasticsearchClusterPreset standard, and
# releaseRef the shared CamundaRelease camunda-8-9, which carries the
# Elasticsearch version.
apiVersion: core.camunda.io/v1
kind: ElasticsearchCluster
metadata:
  name: my-cluster-es
  namespace: my-cluster-ns
spec:
  presetRef: standard
  releaseRef: camunda-8-9
  secondaryStorageConfig: my-storage-config
