# CAUTION: Replace both placeholder values before you apply this file. The
# values below are not valid credentials.
#
# The guide keeps these Secrets in a shared namespace such as camunda-system.
# This inventory keeps them beside the management plane, so that one apply
# creates everything it references.
apiVersion: v1
kind: Secret
metadata:
  name: my-camunda-license
  namespace: my-management-ns
type: Opaque
stringData:
  license-key: "<your Camunda license key>"
---
apiVersion: v1
kind: Secret
metadata:
  name: my-smtp-credentials
  namespace: my-management-ns
type: Opaque
stringData:
  username: "<the SMTP user of Web Modeler>"
  password: "<the SMTP password of Web Modeler>"
