# The PostgreSQL server that CloudNativePG runs for my-cluster. The operator
# publishes the DatabaseServerConfig my-db-server from it, with the host, the
# port, and a reference to the superuser Secret that CloudNativePG writes.
# Do not write that contract or that Secret by hand. A contract of this name
# that already exists is refused with the reason ContractTaken.
#
# spec.archive turns on point-in-time recovery. It needs the Barman Cloud
# plugin, cert-manager, and an ObjectStorageConfig, so this example leaves it
# out. See the guide for the archive fields.
apiVersion: core.camunda.io/v1
kind: DatabaseServer
metadata:
  name: my-db
  namespace: my-cluster-ns
spec:
  version: "17"
  instances: 1
  storageSize: 8Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
  databaseServerConfig: my-db-server
