# The orchestration cluster. storageRef names the SecondaryStorageConfig that
# the Database publishes.
#
# presetRef names the shared CamundaClusterPreset small, which carries the
# broker count, the partitions, the volumes, and the resources. releaseRef
# names the shared CamundaRelease camunda-8-9, which carries the version. What
# stays here is what belongs to this one cluster: its references.
#
# spec.version is unset, so the cluster runs the version of the release. A
# cluster that must move before the fleet does sets spec.version, which wins
# over the release.
apiVersion: core.camunda.io/v1
kind: CamundaCluster
metadata:
  name: my-cluster
  namespace: my-cluster-ns
spec:
  presetRef: small
  releaseRef: camunda-8-9
  platformConfigRef: my-platform-config
  storageRef: my-storage-config
