# What the orchestration clusters of these inventories run. A CamundaRelease
# is cluster scoped and passive, like a preset. Every CamundaCluster that
# names it in spec.releaseRef takes these versions, so one edit here rolls
# every one of them.
#
# The Camunda, connectors, and Elasticsearch versions are the ones the
# end-to-end suite of this repository runs, which test/e2e/matrix/8.9.env pins.
# Keep the two in step when you raise one. The PostgreSQL major is the one that
# suite runs as well.
#
# connectors.version is here for a cluster that turns connectors on. The
# bundle has a patch line of its own, so it does not follow spec.version. No
# inventory here enables connectors.
#
# elasticsearch.version and databaseServer.version are what the storage of
# these inventories runs. Every ElasticsearchCluster and every DatabaseServer
# that names this release in spec.releaseRef takes them. Neither follows
# spec.version: Elasticsearch moves on a line of its own, and
# databaseServer.version is a bare PostgreSQL major such as 17.
#
# A release also carries pinned images and the environment that a version
# needs. Neither is set here, because no inventory needs one. The
# CamundaRelease page shows both.
apiVersion: core.camunda.io/v1
kind: CamundaRelease
metadata:
  name: camunda-8-9
spec:
  version: "8.9.18"
  connectors:
    version: "8.9.9"
  elasticsearch:
    version: "9.2.8"
  databaseServer:
    version: "17"
