apiVersion: core.camunda.io/v1
kind: CamundaClusterPreset
metadata:
  labels:
    app.kubernetes.io/name: camunda-operator
    app.kubernetes.io/managed-by: kustomize
  name: medium
spec:
  cluster:
    version: "8.9.0"
    podLabels:
      company.com/team: "automation-ops"
    podAnnotations:
      company.com/cluster-preset: "medium"
    zeebe:
      replicas: 3
      partitions: 3
      replicationFactor: 3
      resources:
        requests: { cpu: "1", memory: "2Gi" }
        limits: { cpu: "2", memory: "4Gi" }
      storageClassName: "ssd"
      storageSize: "32Gi"
      extraEnv:
        - name: JAVA_OPTS
          value: "-Xmx4g"
    gateway:
      mode: Standalone
      replicas: 2
      resources:
        requests: { cpu: "500m", memory: "1Gi" }
    operate:
      mode: Embedded
    tasklist:
      mode: Embedded
    identity:
      mode: Embedded
    connectors:
      enabled: true
      version: "8.9.7"
      replicas: 1
      resources:
        requests: { cpu: "250m", memory: "512Mi" }
