apiVersion: plugins.camunda.io/v1alpha1
kind: Grant
metadata:
  labels:
    app.kubernetes.io/name: camunda-operator
    app.kubernetes.io/managed-by: kustomize
    plugins.camunda.io/registration: aws-s3
    plugins.camunda.io/request: orders-backup-storage
    plugins.camunda.io/cluster: orders
  name: orders-backup-storage-bucket-access
spec:
  cluster:
    name: orders
  template: bucket-access
  format: aws-iam-statement
  fragment:
    Effect: Allow
    Action:
    - s3:GetObject
    - s3:PutObject
    Resource:
    - arn:aws:s3:::orders-backups/*
