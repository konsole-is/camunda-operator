                    minLength: 1
                    type: string
                required:
                - databaseConfigRef
                type: object
              type:
                description: |-
                  Type selects the secondary storage backend that this contract
                  describes.
                enum:
                - elasticsearch
                - rdbms
                type: string
            required:
