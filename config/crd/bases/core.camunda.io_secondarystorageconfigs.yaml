                      TLS certificate. Set it when the endpoint serves a certificate not
                      signed by a well-known CA, such as the self-signed certificate of an
                      ECK-managed cluster. Omit it for publicly trusted endpoints; it is only
                      valid with an https endpoint.
                    properties:
                      key:
                        description: Key in the Secret holding the value.
                        minLength: 1
                        type: string
                      name:
                        description: Name of the Secret holding the value.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  credentialsSecretRef:
                    description: |-
                      CredentialsSecretRef names a basic-auth user with read/write access to
                      the Camunda indices.
                    properties:
                      name:
                        description: Name of the Secret holding the credentials.
                        minLength: 1
                        type: string
                      passwordKey:
                        default: password
                        description: PasswordKey is the key in the Secret holding
                          the plaintext password.
                        minLength: 1
                        type: string
                      usernameKey:
                        default: username
                        description: UsernameKey is the key in the Secret holding
                          the plaintext username.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  endpoint:
