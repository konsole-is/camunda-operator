                        description: Name is the name of the Secret that holds the
                          credentials.
                        minLength: 1
                        type: string
                      passwordKey:
                        default: password
                        description: PasswordKey is the key in the Secret that holds
                          the plaintext password.
                        minLength: 1
                        type: string
                      usernameKey:
                        default: username
                        description: UsernameKey is the key in the Secret that holds
                          the plaintext username.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  endpoint:
                    description: Endpoint is the HTTP(S) endpoint of the Elasticsearch
                      cluster.
                    type: string
                    x-kubernetes-validations:
