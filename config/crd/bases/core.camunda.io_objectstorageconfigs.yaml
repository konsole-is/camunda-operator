---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: objectstorageconfigs.core.camunda.io
spec:
  group: core.camunda.io
  names:
    kind: ObjectStorageConfig
    listKind: ObjectStorageConfigList
    plural: objectstorageconfigs
    singular: objectstorageconfig
  scope: Cluster
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: |-
          ObjectStorageConfig is the contract CRD that describes a bucket — for
          backups or document storage — and how consumers authenticate against it:
          workload identity on the consumer's ServiceAccount, or static credentials
          in a Secret.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ObjectStorageConfig
            properties:
              azureBlob:
                description: |-
                  AzureBlob describes an Azure Blob Storage container. Required when
                  type is AzureBlob, forbidden otherwise.
                properties:
                  accountName:
                    description: AccountName is the storage account that holds the
                      container.
                    minLength: 1
                    type: string
                  auth:
                    default:
                      type: workloadIdentity
                    description: |-
                      Auth selects how consumers authenticate. An absent block means
                      workload identity through the ServiceAccount chain.
                    properties:
                      credentials:
                        description: |-
                          Credentials is a static storage account key. Required with type
                          credentials, forbidden otherwise.
                        properties:
                          secretRef:
                            description: SecretRef names the Secret key that holds
                              the storage account key.
                            properties:
                              key:
                                description: Key in the Secret holding the value.
                                minLength: 1
                                type: string
                              name:
                                description: Name of the Secret holding the value.
                                minLength: 1
                                type: string
                              namespace:
                                description: Namespace of the Secret.
                                minLength: 1
                                type: string
                            required:
                            - key
                            - name
                            - namespace
                            type: object
                        required:
                        - secretRef
                        type: object
                      type:
                        default: workloadIdentity
                        description: Type is the authentication choice. Defaults to
                          workloadIdentity.
                        enum:
                        - workloadIdentity
                        - credentials
                        type: string
                      workloadIdentity:
                        description: |-
                          WorkloadIdentity names the trusted principal. Only valid with type
                          workloadIdentity; an empty or absent block means "trust the
                          ServiceAccount chain, add nothing".
                        properties:
                          clientId:
                            description: |-
                              ClientID is the managed identity that consumers use. When set, the
                              operator puts it in the azure.workload.identity/client-id annotation
                              of the consumer's ServiceAccount.
                            type: string
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: credentials is required when auth.type is credentials
                        and must not be set otherwise
                      rule: (self.type == 'credentials') == has(self.credentials)
                    - message: workloadIdentity is only valid when auth.type is workloadIdentity
                      rule: '!has(self.workloadIdentity) || self.type == ''workloadIdentity'''
                  basePath:
                    description: |-
                      BasePath is the blob prefix under which consumers write objects. Empty
                      means the container root.
                    type: string
                  container:
                    description: Container is the blob container that consumers write
                      to.
                    minLength: 1
                    type: string
                  endpoint:
                    description: |-
                      Endpoint is the URL of the blob service. Empty means the public Azure
                      endpoint of the account. Set it for Azurite and sovereign clouds.
                    type: string
                    x-kubernetes-validations:
                    - message: endpoint must be a valid http or https URL
                      rule: isURL(self) && (url(self).getScheme() == 'http' || url(self).getScheme()
                        == 'https')
                required:
                - accountName
                - container
                type: object
              gcs:
                description: |-
                  GCS describes a Google Cloud Storage bucket. Required when type is
                  GCS, forbidden otherwise.
                properties:
                  auth:
                    default:
                      type: workloadIdentity
                    description: |-
                      Auth selects how consumers authenticate. An absent block means
                      workload identity through the ServiceAccount chain.
                    properties:
                      credentials:
                        description: |-
                          Credentials is a static service-account key. Required with type
                          credentials, forbidden otherwise.
                        properties:
                          secretRef:
                            description: |-
                              SecretRef names the Secret key that holds the service-account JSON
                              key.
                            properties:
                              key:
                                description: Key in the Secret holding the value.
                                minLength: 1
                                type: string
                              name:
                                description: Name of the Secret holding the value.
                                minLength: 1
                                type: string
                              namespace:
                                description: Namespace of the Secret.
                                minLength: 1
                                type: string
                            required:
                            - key
                            - name
                            - namespace
                            type: object
                        required:
                        - secretRef
                        type: object
                      type:
                        default: workloadIdentity
                        description: Type is the authentication choice. Defaults to
                          workloadIdentity.
                        enum:
                        - workloadIdentity
                        - credentials
                        type: string
                      workloadIdentity:
                        description: |-
                          WorkloadIdentity names the trusted principal. Only valid with type
                          workloadIdentity; an empty or absent block means "trust the
                          ServiceAccount chain, add nothing".
                        properties:
                          serviceAccountEmail:
                            description: |-
                              ServiceAccountEmail is the Google service account that consumers
                              impersonate. When set, the operator puts it in the
                              iam.gke.io/gcp-service-account annotation of the consumer's
                              ServiceAccount.
                            type: string
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: credentials is required when auth.type is credentials
                        and must not be set otherwise
                      rule: (self.type == 'credentials') == has(self.credentials)
                    - message: workloadIdentity is only valid when auth.type is workloadIdentity
                      rule: '!has(self.workloadIdentity) || self.type == ''workloadIdentity'''
                  basePath:
                    description: |-
                      BasePath is the key prefix under which consumers write objects. Empty
                      means the bucket root.
                    type: string
                  bucketName:
                    description: BucketName is the bucket name as used by storage
                      client SDKs.
                    minLength: 1
                    type: string
                required:
                - bucketName
                type: object
              s3:
                description: |-
                  S3 describes an S3 or S3-compatible bucket. Required when type is S3,
                  forbidden otherwise.
                properties:
                  auth:
                    default:
                      type: workloadIdentity
                    description: |-
                      Auth selects how consumers authenticate. An absent block means
                      workload identity through the ServiceAccount chain.
                    properties:
                      credentials:
                        description: |-
                          Credentials are static keys. Required with type credentials, forbidden
                          otherwise.
                        properties:
                          secretRef:
                            description: SecretRef names the Secret keys that hold
                              the access-key pair.
                            properties:
                              accessKeyIdKey:
                                description: AccessKeyIDKey is the key in the Secret
                                  holding the access key ID.
                                minLength: 1
                                type: string
                              name:
                                description: Name of the Secret holding the keys.
                                minLength: 1
                                type: string
                              namespace:
                                description: Namespace of the Secret.
                                minLength: 1
                                type: string
                              secretAccessKeyKey:
                                description: |-
                                  SecretAccessKeyKey is the key in the Secret holding the secret access
                                  key.
                                minLength: 1
                                type: string
                            required:
                            - accessKeyIdKey
                            - name
                            - namespace
                            - secretAccessKeyKey
                            type: object
                        required:
                        - secretRef
                        type: object
                      type:
                        default: workloadIdentity
                        description: Type is the authentication choice. Defaults to
                          workloadIdentity.
                        enum:
                        - workloadIdentity
                        - credentials
                        type: string
                      workloadIdentity:
                        description: |-
                          WorkloadIdentity names the trusted principal. Only valid with type
                          workloadIdentity; an empty or absent block means "trust the
                          ServiceAccount chain, add nothing".
                        properties:
                          roleArn:
                            description: |-
                              RoleARN is the IAM role that consumers assume. When set, the operator
                              puts it in the eks.amazonaws.com/role-arn annotation of the consumer's
                              ServiceAccount (IRSA).
                            type: string
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: credentials is required when auth.type is credentials
                        and must not be set otherwise
                      rule: (self.type == 'credentials') == has(self.credentials)
                    - message: workloadIdentity is only valid when auth.type is workloadIdentity
                      rule: '!has(self.workloadIdentity) || self.type == ''workloadIdentity'''
                  basePath:
                    description: |-
                      BasePath is the key prefix under which consumers write objects. Empty
                      means the bucket root.
                    type: string
                  bucketName:
                    description: BucketName is the bucket name as used by storage
                      client SDKs.
                    minLength: 1
                    type: string
                  endpoint:
                    description: |-
                      Endpoint is the URL of an S3-compatible store (MinIO, Ceph, and more).
                      Empty means AWS S3, addressed through region.
                    type: string
                    x-kubernetes-validations:
                    - message: endpoint must be a valid http or https URL
                      rule: isURL(self) && (url(self).getScheme() == 'http' || url(self).getScheme()
                        == 'https')
                  forcePathStyle:
                    description: |-
                      ForcePathStyle forces path-style bucket addressing. Set it for
                      S3-compatible stores that do not serve virtual-hosted-style requests.
                    type: boolean
                  region:
                    description: Region of the bucket. Required unless endpoint is
                      set.
                    type: string
                required:
                - bucketName
                type: object
                x-kubernetes-validations:
                - message: region is required unless endpoint is set
                  rule: (has(self.region) && self.region.size() > 0) || (has(self.endpoint)
                    && self.endpoint.size() > 0)
              type:
                description: Type selects the storage API of the bucket.
                enum:
                - S3
                - GCS
                - AzureBlob
                type: string
            required:
            - type
            type: object
            x-kubernetes-validations:
            - message: exactly the block matching spec.type must be set
              rule: (self.type == 'S3') == has(self.s3) && (self.type == 'GCS') ==
                has(self.gcs) && (self.type == 'AzureBlob') == has(self.azureBlob)
          status:
            description: status defines the observed state of ObjectStorageConfig
            properties:
              conditions:
                description: |-
                  Conditions represent the current validation state; the Ready condition
                  carries the reasons Healthy and MissingSecret.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the last generation reconciled
                  by the operator.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
