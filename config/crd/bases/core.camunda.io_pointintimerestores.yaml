---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: pointintimerestores.core.camunda.io
spec:
  group: core.camunda.io
  names:
    kind: PointInTimeRestore
    listKind: PointInTimeRestoreList
    plural: pointintimerestores
    shortNames:
    - pitr
    singular: pointintimerestore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.clusterRef.name
      name: Cluster
      type: string
    - jsonPath: .spec.timestamp
      name: Timestamp
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          PointInTimeRestore brings the primary storage of a suspended CamundaCluster
          with relational secondary storage to the same point in time as its
          database. It reads the exporter position of every partition from that
          database. Then it deletes and creates the broker data volumes again. Then
          it runs the Camunda restore application with the requested point, one
          time for each broker.

          The database reaches that point in one of two ways. A DatabaseServerConfig
          that declares pitr.recovery: operator is rolled back by its publisher. The
          restore writes the request on the contract and waits for the answer. A
          contract that declares external, the default, is rolled back before you
          create the restore. The restore reads the database as it is.

          The restore prepares the cluster itself. It suspends the cluster and waits
          for its brokers to stop. When it completes, it removes the suspension, but
          only a suspension that it applied itself. A failed restore leaves the
          cluster suspended. A restore that somebody deletes while it runs also
          leaves the cluster suspended. Empty or half-written broker volumes cause
          more damage under running brokers.

          It writes no version. This kind restores the primary storage of the
          cluster from the continuous backups of the same cluster. Thus no backup
          names a version other than the version that the cluster runs.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              spec names the cluster to restore and the point that its database
              holds. It is immutable. A restore runs one time. To try again, create
              a new resource.
            properties:
              clusterRef:
                description: |-
                  ClusterRef references the CamundaCluster to restore, in the namespace
                  of this restore. Its secondary storage must be a relational database.
                properties:
                  name:
                    description: |-
                      Name is the name of the CamundaCluster, in the namespace of this
                      object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              timestamp:
                description: |-
                  Timestamp is the point to restore to.
                  DatabaseServerConfig.spec.pitr.recovery sets who rolls the database
                  server back to it. With operator, the restore asks the server to roll
                  back to this point. With external, you roll the server back to it
                  before you create the restore.

                  Choose a point at least one backup interval before the cluster stopped
                  writing. Also choose a point inside the window in which Zeebe keeps its
                  primary-storage backups. The CamundaCluster sets these with
                  spec.backup.primaryStorage.schedule and retention.window. The defaults
                  are one hour and seven days. If no backup covers the point, the restore
                  fails after it erased the broker volumes.

                  The point must be inside the retention period of the database server,
                  and it must not be in the future. The operator does these two checks.
                format: date-time
                type: string
            required:
            - clusterRef
            - timestamp
            type: object
            x-kubernetes-validations:
            - message: 'spec is immutable: a restore is one-shot, retried by creating
                a new resource'
              rule: self == oldSelf
          status:
            description: status defines the observed state of the restore
            properties:
              backend:
                description: |-
                  Backend names the database that the restore holds while its server
                  rolls back: the host, the port, and the database name. The operator
                  records it just before it asks for the rollback. It follows each
                  endpoint that the contract names. From then until the final phase, no
                  other CamundaCluster starts on this database, also when the contract
                  names another endpoint. A restore whose server
                  rolls back outside the operator records no backend.
                type: string
              brokers:
                description: |-
                  Brokers is the broker count of the broker StatefulSet. The operator
                  records it before the restore deletes a volume. It sets how many
                  volumes the restore creates again and how many Jobs run.
                format: int32
                type: integer
              clusterSuspended:
                description: |-
                  ClusterSuspended records that this restore suspended its target
                  cluster. The restore removes that suspension when it reaches
                  Completed. A cluster that its owner suspended has no such record, so
                  it stays suspended. The cluster of a failed restore also stays
                  suspended.
                type: boolean
              completionTime:
                description: CompletionTime is when the restore reached a final phase.
                format: date-time
                type: string
              conditions:
                description: Conditions represent the current state of the restore.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failureMessage:
                description: |-
                  FailureMessage names the failed phase and its error. The Ready
                  condition has the same message.
                type: string
              firstFailedAt:
                description: |-
                  FirstFailedAt is when a dependency of the running restore first stopped
                  resolving. The grace period starts at this time. After the restore
                  starts, the field stays set, so a dependency that fails and recovers
                  again and again does not reset the grace period.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the last generation that the operator
                  processed.
                format: int64
                type: integer
              observedPositions:
                description: |-
                  ObservedPositions are the exporter positions that the pre-check read,
                  in partition order. They show what the operator saw when the restore
                  passed the database-state check, or what stopped it.
                items:
                  description: |-
                    PartitionPosition is the exporter position of one partition, as the
                    pre-check read it from the restored database.
                  properties:
                    lastUpdated:
                      description: |-
                        LastUpdated is the LAST_UPDATED value of the row of the partition in the
                        EXPORTER_POSITION table.
                      format: date-time
                      type: string
                    partitionId:
                      description: PartitionID is the Zeebe partition.
                      format: int32
                      type: integer
                  required:
                  - lastUpdated
                  - partitionId
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - partitionId
                x-kubernetes-list-type: map
              phase:
                description: |-
                  Phase is the phase of the restore. The restore continues from it after
                  an interruption.
                enum:
                - Pending
                - RestoringDatabase
                - ValidatingDatabaseState
                - RestoringPrimaryStorage
                - Completed
                - Failed
                type: string
              primaryJobNames:
                description: |-
                  PrimaryJobNames are the restore application Jobs, one for each broker,
                  in broker order. The operator records them before it creates the Jobs.
                  A completed restore removes these Jobs. The logs of these Jobs explain
                  a failed restore.
                items:
                  type: string
                type: array
              recreatedClaims:
                description: |-
                  RecreatedClaims names the broker data claims that the restore deleted
                  and created again. Thus the restore does not delete a claim two times.
                items:
                  type: string
                type: array
              storage:
                description: |-
                  Storage records the storage chain that the restore validated. The
                  operator records it one time, before it reads the database. If a later
                  read does not agree, the restore fails.
                properties:
                  databaseConfig:
                    description: DatabaseConfig is the contract of the logical database.
                    type: string
                  databaseConfigUID:
                    description: DatabaseConfigUID records the identity of that contract.
                    type: string
                  databaseName:
                    description: |-
                      DatabaseName is the logical database whose exporter position the
                      pre-check read.
                    type: string
                  databaseServerConfig:
                    description: |-
                      DatabaseServerConfig is the contract of the server that holds the
                      database and declares its point-in-time recovery.
                    type: string
                  databaseServerConfigUID:
                    description: DatabaseServerConfigUID records the identity of that
                      contract.
                    type: string
                  endpoint:
                    description: |-
                      Endpoint is the host and port of the server, as the pre-check used it.
                      A contract that now names another endpoint names another server.
                    type: string
                  secondaryStorageConfig:
                    description: SecondaryStorageConfig is the storage contract of
                      the cluster.
                    type: string
                  secondaryStorageConfigUID:
                    description: |-
                      SecondaryStorageConfigUID records the identity of that contract. Thus
                      the restore finds a contract that was deleted and created again with
                      the same name.
                    type: string
                  systemIdentifier:
                    description: |-
                      SystemIdentifier is the identity of the PostgreSQL instance behind that
                      endpoint, as the contract published it. The rule for a dedicated server
                      counted this identity. An endpoint that later reports another identity
                      is another instance.
                    type: string
                required:
                - databaseConfig
                - databaseName
                - databaseServerConfig
                - endpoint
                - secondaryStorageConfig
                - systemIdentifier
                type: object
              targetClusterUID:
                description: |-
                  TargetClusterUID records the identity of the target cluster. A cluster
                  that is deleted and created again with the same name is another
                  cluster, and this restore does not apply to it.
                type: string
              terminalReason:
                description: |-
                  TerminalReason is the Ready reason that the operator recorded when the
                  restore reached its final phase. The operator sets the final condition
                  again from this field, so a write conflict cannot replace the reason.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
