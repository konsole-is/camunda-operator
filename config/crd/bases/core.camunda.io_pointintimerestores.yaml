---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: pointintimerestores.core.camunda.io
spec:
  group: core.camunda.io
  names:
    kind: PointInTimeRestore
    listKind: PointInTimeRestoreList
    plural: pointintimerestores
    shortNames:
    - pitr
    singular: pointintimerestore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.clusterRef.name
      name: Cluster
      type: string
    - jsonPath: .spec.timestamp
      name: Timestamp
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          PointInTimeRestore aligns the primary storage of a suspended,
          relational-backed CamundaCluster with a database that was already restored
          to a point in time. The operator never restores the database server. It
          reads the exporter position of every partition from the restored database,
          deletes and creates the broker data volumes again, and runs the Camunda
          restore application with the requested point once per broker. The operator
          only reads spec.suspend of the cluster. Whoever owns the cluster suspends
          it before the restore and unsuspends it after.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              spec names the cluster to align and the point its database holds. It is
              immutable: a restore is one-shot, retried by creating a new resource.
            properties:
              clusterRef:
                description: |-
                  ClusterRef references the CamundaCluster to align, in the namespace of
                  this restore. Its secondary storage must be a relational database.
                properties:
                  name:
                    description: Name of the CamundaCluster, in the namespace of this
                      object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              timestamp:
                description: |-
                  Timestamp is the point the database was already restored to. It must
                  lie within the retention period the database server declares. It must
                  not lie in the future either, and the operator checks that at reconcile
                  time, because a CEL rule has no clock.
                format: date-time
                type: string
            required:
            - clusterRef
            - timestamp
            type: object
            x-kubernetes-validations:
            - message: 'spec is immutable: a restore is one-shot, retried by creating
                a new resource'
              rule: self == oldSelf
          status:
            description: status defines the observed state of the restore
            properties:
              brokers:
                description: Brokers is the broker count read from the live broker
                  StatefulSet.
                format: int32
                type: integer
              clusterUID:
                description: ClusterUID pins the identity of the cluster.
                type: string
              completionTime:
                description: CompletionTime is when the restore reached a terminal
                  phase.
                format: date-time
                type: string
              conditions:
                description: |-
                  Conditions represent the current state. The Ready condition carries the
                  reasons Progressing, Completed, Failed, ClusterNotSuspended,
                  InvalidReference, PitrUnavailable, SharedServer, DatabaseNotRestored,
                  MissingSecret, and ConnectionFailed.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failureMessage:
                description: |-
                  FailureMessage names the failing phase and its error. The Ready
                  condition carries the same message, and the operator stages the
                  condition again from this field, so a write conflict cannot lose it.
                type: string
              firstFailedAt:
                description: |-
                  FirstFailedAt is when a dependency of the running restore first stopped
                  resolving. The operator measures the mid-run grace from it, and clears
                  it when the restore recovers.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the last generation reconciled
                  by the operator.
                format: int64
                type: integer
              observedPositions:
                description: |-
                  ObservedPositions are the exporter positions the pre-check read, in
                  partition order. They record what the operator saw when it let the
                  restore past the database-state check, or what held it.
                items:
                  description: |-
                    PartitionPosition is the exporter position of one partition, as the
                    pre-check read it from the restored database.
                  properties:
                    lastUpdated:
                      description: |-
                        LastUpdated is the LAST_UPDATED value of the partition's row in the
                        EXPORTER_POSITION table.
                      format: date-time
                      type: string
                    partitionId:
                      description: PartitionID is the Zeebe partition.
                      format: int32
                      type: integer
                  required:
                  - lastUpdated
                  - partitionId
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - partitionId
                x-kubernetes-list-type: map
              phase:
                description: Phase of the restore. It is the resume marker.
                enum:
                - Pending
                - ValidatingDatabaseState
                - RestoringPrimaryStorage
                - Completed
                - Failed
                type: string
              primaryJobNames:
                description: |-
                  PrimaryJobNames are the per-broker restore-application Jobs, in broker
                  order.
                items:
                  type: string
                type: array
              recreatedClaims:
                description: |-
                  RecreatedClaims names the broker data claims that the restore deleted
                  and created again.
                items:
                  type: string
                type: array
              terminalReason:
                description: |-
                  TerminalReason is the Ready reason recorded at the terminal transition:
                  Completed or Failed. The operator stages the terminal condition again
                  from this field, so a write conflict cannot replace the reason with a
                  weaker one.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
