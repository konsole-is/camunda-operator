---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: pointintimerestores.core.camunda.io
spec:
  group: core.camunda.io
  names:
    kind: PointInTimeRestore
    listKind: PointInTimeRestoreList
    plural: pointintimerestores
    shortNames:
    - pitr
    singular: pointintimerestore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.clusterRef.name
      name: Cluster
      type: string
    - jsonPath: .spec.timestamp
      name: Timestamp
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          PointInTimeRestore aligns the primary storage of a suspended,
          relational-backed CamundaCluster with a database at a point in time. It
          reads the exporter position of every partition from that database, deletes
          and creates the broker data volumes again, and runs the Camunda restore
          application with the requested point once per broker.

          The database reaches that point in one of two ways. A DatabaseServerConfig
          that declares pitr.recovery: operator is rolled back by whoever publishes
          it: the restore writes the request on the contract and waits for the
          answer. A contract that declares external, the default, is rolled back
          before the restore is created, and the restore reads the database as it
          finds it.

          The restore prepares the cluster itself. It suspends the cluster and waits
          for its brokers to stop. It withdraws the suspension when it completes, and
          only when it applied that suspension itself. A failed restore leaves the
          cluster suspended, and so does a restore that somebody deletes while it
          runs: broker volumes that are empty or half written are worse under running
          brokers than under none.

          It writes no version. This kind restores the primary storage of the cluster
          from the continuous backups of that same cluster, so no backup names a
          version that the cluster is not already running.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              spec names the cluster to align and the point its database holds. It is
              immutable: a restore is one-shot, retried by creating a new resource.
            properties:
              clusterRef:
                description: |-
                  ClusterRef references the CamundaCluster to align, in the namespace of
                  this restore. Its secondary storage must be a relational database.
                properties:
                  name:
                    description: Name of the CamundaCluster, in the namespace of this
                      object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              timestamp:
                description: |-
                  Timestamp is the point to restore to. Who rolls the database server
                  back to it depends on DatabaseServerConfig.spec.pitr.recovery: with
                  operator the restore asks the server to roll back to this point, with
                  external you roll the server back to it before you create the restore.

                  Choose that point at least one backup interval before the cluster
                  stopped writing, and inside the window that Zeebe keeps its
                  primary-storage backups for. Those are spec.backup.primaryStorage
                  schedule and retention.window of the CamundaCluster, which default to
                  one hour and seven days. A point that no backup covers fails the
                  restore after it erased the broker volumes.

                  It must also lie within the retention period that the database server
                  declares, and it must not lie in the future. The operator checks both
                  at reconcile time, because a CEL rule has no clock.
                format: date-time
                type: string
            required:
            - clusterRef
            - timestamp
            type: object
            x-kubernetes-validations:
            - message: 'spec is immutable: a restore is one-shot, retried by creating
                a new resource'
              rule: self == oldSelf
          status:
            description: status defines the observed state of the restore
            properties:
              brokers:
                description: |-
                  Brokers is the broker count read from the live broker StatefulSet and
                  recorded before the restore deletes a volume. It fixes how many volumes
                  are recreated and how many Jobs run.
                format: int32
                type: integer
              clusterSuspended:
                description: |-
                  ClusterSuspended records that this restore suspended its target
                  cluster. The restore withdraws that suspension when it reaches
                  Completed. A cluster that its owner suspended carries no such record,
                  so it stays suspended, and so does the cluster of a failed restore.
                type: boolean
              completionTime:
                description: CompletionTime is when the restore reached a terminal
                  phase.
                format: date-time
                type: string
              conditions:
                description: Conditions represent the current state of the restore.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failureMessage:
                description: |-
                  FailureMessage names the failing phase and its error. The Ready
                  condition carries the same message.
                type: string
              firstFailedAt:
                description: |-
                  FirstFailedAt is when a dependency of the running restore first stopped
                  resolving. The operator measures the mid-run grace from it. It stays
                  set once the restore starts, because a dependency that flaps must not
                  reset the grace.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the last generation reconciled
                  by the operator.
                format: int64
                type: integer
              observedPositions:
                description: |-
                  ObservedPositions are the exporter positions the pre-check read, in
                  partition order. They record what the operator saw when it let the
                  restore past the database-state check, or what held it.
                items:
                  description: |-
                    PartitionPosition is the exporter position of one partition, as the
                    pre-check read it from the restored database.
                  properties:
                    lastUpdated:
                      description: |-
                        LastUpdated is the LAST_UPDATED value of the partition's row in the
                        EXPORTER_POSITION table.
                      format: date-time
                      type: string
                    partitionId:
                      description: PartitionID is the Zeebe partition.
                      format: int32
                      type: integer
                  required:
                  - lastUpdated
                  - partitionId
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - partitionId
                x-kubernetes-list-type: map
              phase:
                description: Phase of the restore. It is the resume marker.
                enum:
                - Pending
                - RestoringDatabase
                - ValidatingDatabaseState
                - RestoringPrimaryStorage
                - Completed
                - Failed
                type: string
              primaryJobNames:
                description: |-
                  PrimaryJobNames are the per-broker restore-application Jobs, in broker
                  order. The operator records them before it applies the Jobs, so the
                  record covers every Job that the next look finds. It is also the list
                  that a restore which completed removes, and the list whose logs explain
                  a restore that failed.
                items:
                  type: string
                type: array
              recreatedClaims:
                description: |-
                  RecreatedClaims names the broker data claims that the restore deleted
                  and created again. A reconcile that re-enters does not delete a claim
                  twice.
                items:
                  type: string
                type: array
              storage:
                description: |-
                  Storage pins the storage chain that the restore validated. The operator
                  records it once, before it reads the database, and fails the restore
                  when a later look disagrees.
                properties:
                  databaseConfig:
                    description: DatabaseConfig is the contract of the logical database.
                    type: string
                  databaseConfigUID:
                    description: DatabaseConfigUID pins the identity of that contract.
                    type: string
                  databaseName:
                    description: |-
                      DatabaseName is the logical database whose exporter position the
                      pre-check read.
                    type: string
                  databaseServerConfig:
                    description: |-
                      DatabaseServerConfig is the contract of the server that holds the
                      database and declares its point-in-time recovery.
                    type: string
                  databaseServerConfigUID:
                    description: DatabaseServerConfigUID pins the identity of that
                      contract.
                    type: string
                  endpoint:
                    description: |-
                      Endpoint is the host and port of the server, as the pre-check reached
                      it. A server that is repointed in place is another server.
                    type: string
                  secondaryStorageConfig:
                    description: SecondaryStorageConfig is the storage contract of
                      the cluster.
                    type: string
                  secondaryStorageConfigUID:
                    description: |-
                      SecondaryStorageConfigUID pins the identity of that contract, so a
                      contract that was deleted and created again under one name is caught.
                    type: string
                  systemIdentifier:
                    description: |-
                      SystemIdentifier is the identity of the PostgreSQL instance behind that
                      endpoint, as the contract published it. It is what the dedicated-server
                      rule counted, and an endpoint that starts reporting another identity
                      holds another instance.
                    type: string
                required:
                - databaseConfig
                - databaseName
                - databaseServerConfig
                - endpoint
                - secondaryStorageConfig
                - systemIdentifier
                type: object
              targetClusterUID:
                description: |-
                  TargetClusterUID pins the identity of the target cluster. A cluster
                  that is deleted and created again under the same name is another
                  cluster, and this restore is not its restore.
                type: string
              terminalReason:
                description: |-
                  TerminalReason is the Ready reason recorded at the terminal transition.
                  The operator stages the terminal condition again from this field, so a
                  write conflict cannot replace the reason with a weaker one.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
