          metadata:
            type: object
          spec:
            description: spec defines the desired state of DatabaseServerPreset
            properties:
              server:
                description: |-
                  Server is the full configuration baseline consumers inherit. It reuses
                  the DatabaseServer spec type so the two never drift apart. The
                  instance-bound fields of that type, presetRef, databaseServerConfig,
                  and suspend, must be left unset inside a preset. Explicit zero values
                  (an empty presetRef, suspend: false), as templated YAML renders unset
                  fields, count as unset. archive is a baseline like any other field: one
                  bucket serves a fleet, because every server writes under a prefix of
                  its own.
                properties:
                  archive:
                    description: |-
                      Archive points the server at the bucket that holds its continuous
                      archive. Without it the server takes no part in point-in-time restore.
                    properties:
                      baseBackupSchedule:
                        default: 0 0 2 * * *
                        description: |-
                          BaseBackupSchedule is when a base backup is taken, as the six-field
                          cron of CloudNativePG (seconds first, in UTC). The first base backup
                          runs as soon as the server is up, whatever the schedule says, because
                          the archive can be recovered from only after it completes.
                        type: string
                      objectStorageRef:
                        description: |-
                          ObjectStorageRef names a cluster-scoped ObjectStorageConfig. The
                          operator writes the archive under a prefix of that bucket that holds
                          this server alone.
