---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: databaseserverconfigs.core.camunda.io
spec:
  group: core.camunda.io
  names:
    kind: DatabaseServerConfig
    listKind: DatabaseServerConfigList
    plural: databaseserverconfigs
    singular: databaseserverconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.serverVersion
      name: Version
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          DatabaseServerConfig is the contract CRD that describes a database server —
          engine, endpoint, admin credentials, and point-in-time-recovery capability —
          for controllers that bootstrap databases on it or validate its declared
          capabilities. A consumer resolves it in its own namespace, so the whole
          RDBMS chain of a cluster lives with that cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of DatabaseServerConfig
            properties:
              adminCredentialsSecretRef:
                description: |-
                  AdminCredentialsSecretRef names an admin user with permission to create
                  databases and roles; used by the Database controller to bootstrap. The
                  Secret lives in the namespace of this contract.
                properties:
                  name:
                    description: Name of the Secret holding the credentials.
                    minLength: 1
                    type: string
                  passwordKey:
                    default: password
                    description: PasswordKey is the key in the Secret holding the
                      plaintext password.
                    minLength: 1
                    type: string
                  usernameKey:
                    default: username
                    description: UsernameKey is the key in the Secret holding the
                      plaintext username.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              engine:
                description: |-
                  Engine is the database engine of the server. See DatabaseEngine for
                  the accepted values.
                enum:
                - postgres
                type: string
              host:
                description: Host the server is reachable at.
                minLength: 1
                type: string
              pitr:
                description: PITR declares the server's point-in-time-recovery capability.
                properties:
                  enabled:
                    default: false
                    description: Enabled reports whether the server performs continuous
                      WAL archiving.
                    type: boolean
                  retentionPeriodDays:
                    description: |-
                      RetentionPeriodDays is how many days into the past a point-in-time
                      restore can target. Required when enabled is true.
                    format: int32
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: retentionPeriodDays of at least 1 is required when enabled
                    is true
                  rule: '!self.enabled || (has(self.retentionPeriodDays) && self.retentionPeriodDays
                    >= 1)'
              port:
                description: Port the server listens on.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
            required:
            - adminCredentialsSecretRef
            - engine
            - host
            - port
            type: object
          status:
            description: status defines the observed state of DatabaseServerConfig
            properties:
              conditions:
                description: |-
                  Conditions represent the current validation state. The Ready condition
                  carries reasons Healthy, MissingSecret, or ConnectionFailed.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the last generation reconciled
                  by the operator.
                format: int64
                type: integer
              probedAt:
                description: |-
                  ProbedAt is when the operator last reached the server and read
                  ServerVersion and SystemIdentifier. The operator probes the server again
                  when this is older than the probe interval, when the spec changed, or
                  when the admin credentials Secret changed. A reconcile in between leaves
                  it untouched.
                format: date-time
                type: string
              probedSecretVersion:
                description: |-
                  ProbedSecretVersion is the resourceVersion of the admin credentials
                  Secret that the last probe used. The operator probes a changed Secret
                  again before the interval, so it validates rotated credentials promptly.
                type: string
              serverVersion:
                description: |-
                  ServerVersion is the major version that the server reported the last
                  time the operator reached it, for example "17". A dump of a database on
                  this server runs client tools of this major, so a backup waits until
                  the operator publishes it.
                type: string
              systemIdentifier:
                description: |-
                  SystemIdentifier is the identity of the PostgreSQL instance behind this
                  endpoint, as the server reported it on the last probe. It names the
                  server itself, so two contracts that describe one server under
                  different hosts publish one value. The Database controller keys the
                  uniqueness of a logical database on it.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
