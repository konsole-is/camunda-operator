---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: logicalbackupelasticsearches.core.camunda.io
spec:
  group: core.camunda.io
  names:
    kind: LogicalBackupElasticsearch
    listKind: LogicalBackupElasticsearchList
    plural: logicalbackupelasticsearches
    shortNames:
    - lbes
    singular: logicalbackupelasticsearch
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.step
      name: Step
      type: string
    - jsonPath: .status.backupId
      name: Backup ID
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          LogicalBackupElasticsearch is one backup of an Elasticsearch-backed
          CamundaCluster. The backup is one coordinated set under one backup ID: the
          web-application indices, the exported Zeebe record indices, and the Zeebe
          partitions. It is taken hot, with exporting soft-paused. LogicalRestore
          consumes a completed backup. When you delete the resource, a finalizer
          deletes the stored artifacts.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              spec identifies the cluster to back up. It is immutable: a backup is a
              one-shot operation, retried by creating a new resource.
            properties:
              clusterRef:
                description: |-
                  ClusterRef references the CamundaCluster to back up. Its secondary
                  storage must be Elasticsearch.
                properties:
                  name:
                    description: Name of the CamundaCluster.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the CamundaCluster. Empty means the namespace of the
                      referencing object.
                    type: string
                required:
                - name
                type: object
            required:
            - clusterRef
            type: object
            x-kubernetes-validations:
            - message: 'spec is immutable: a backup is one-shot, retried by creating
                a new resource'
              rule: self == oldSelf
          status:
            description: status defines the observed state of the backup
            properties:
              backupId:
                description: |-
                  BackupID keys every part of the backup set: the web-application
                  snapshots, the record snapshot, and the partition backup. A restore
                  locates the set by it.
                format: int64
                type: integer
              completionTime:
                description: CompletionTime is when the backup reached a terminal
                  phase.
                format: date-time
                type: string
              conditions:
                description: |-
                  Conditions represent the current state. The Ready condition tracks the
                  backup with the reasons Progressing, Completed, Failed, ResumeFailed,
                  ClusterSuspended, BackupInProgress, StorageTypeMismatch,
                  InvalidReference, MissingSecret, and ConnectionFailed.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failureMessage:
                description: |-
                  FailureMessage names the failing step and its error. It is recorded
                  when a step fails and exporting still has to be resumed, so the reason
                  survives the resume and reaches the terminal condition.
                type: string
              history:
                description: History is the backup of the web-application indices.
                properties:
                  failureReason:
                    description: FailureReason is set when State is Failed.
                    type: string
                  state:
                    description: State of this part.
                    enum:
                    - Pending
                    - InProgress
                    - Completed
                    - Failed
                    type: string
                type: object
              historySnapshots:
                description: |-
                  HistorySnapshots names the Elasticsearch snapshots of the
                  web-application indices. The names are recorded as soon as the
                  management API reports them. The finalizer and a restore can then
                  locate the snapshots after the cluster is gone.
                items:
                  type: string
                type: array
              lastResumeAttemptTime:
                description: |-
                  LastResumeAttemptTime is when resume was last attempted. The gap to the
                  next attempt decides whether the deadline anchor slides.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the last generation reconciled
                  by the operator.
                format: int64
                type: integer
              partitionsCount:
                description: |-
                  PartitionsCount is the partition count of the cluster when the backup
                  started. A restore must match it.
                format: int32
                type: integer
              phase:
                description: Phase of the backup. Completed and Failed are terminal.
                enum:
                - Pending
                - Running
                - Completed
                - Failed
                type: string
              records:
                description: Records is the snapshot of the exported Zeebe record
                  indices.
                properties:
                  failureReason:
                    description: FailureReason is set when State is Failed.
                    type: string
                  state:
                    description: State of this part.
                    enum:
                    - Pending
                    - InProgress
                    - Completed
                    - Failed
                    type: string
                type: object
              repository:
                description: |-
                  Repository pins the snapshot repository that every part of the set is
                  written to. It is recorded when the backup starts. Every later step and
                  the finalizer use the pinned name. A repository that changes on the
                  storage contract mid-run can then neither split the set nor aim the
                  deletion at the wrong repository.
                type: string
              resumeStartedTime:
                description: |-
                  ResumeStartedTime anchors the resume deadline. Only the accumulated
                  time of active resume attempts counts against the deadline. A gap in
                  which the procedure was parked slides the anchor forward and does not
                  count, for example a suspended cluster or an unpublished binding. The
                  anchor survives an operator restart.
                format: date-time
                type: string
              runtime:
                description: Runtime is the backup of the Zeebe partitions.
                properties:
                  failureReason:
                    description: FailureReason is set when State is Failed.
                    type: string
                  state:
                    description: State of this part.
                    enum:
                    - Pending
                    - InProgress
                    - Completed
                    - Failed
                    type: string
                type: object
              step:
                description: Step is the resume marker of the running procedure.
                enum:
                - PauseExporting
                - BackupHistory
                - SnapshotRecords
                - BackupRuntime
                - ResumeExporting
                type: string
              storageSizes:
                description: |-
                  StorageSizes are the effective restore sizes, recorded best effort when
                  the backup starts.
                properties:
                  elasticsearch:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      Elasticsearch is the effective restore size of one Elasticsearch data
                      volume.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  zeebe:
                    anyOf:
                    - type: integer
                    - type: string
                    description: Zeebe is the effective restore size of one broker
                      data volume.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                type: object
              terminalReason:
                description: |-
                  TerminalReason is the Ready reason recorded at the terminal
                  transition: Completed, Failed, or ResumeFailed. The controller
                  re-stages the terminal condition from it when a write conflict
                  restored an older one.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
