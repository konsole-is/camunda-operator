---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: pluginrequests.plugins.camunda.io
spec:
  group: plugins.camunda.io
  names:
    kind: PluginRequest
    listKind: PluginRequestList
    plural: pluginrequests
    singular: pluginrequest
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.conditions[?(@.type=="OutputsReady")].status
      name: Outputs
      type: string
    - jsonPath: .spec.section
      name: Section
      priority: 1
      type: string
    - jsonPath: .spec.registration
      name: Registration
      priority: 1
      type: string
    - jsonPath: .spec.claimRef.name
      name: Claim
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PluginRequest asks a plugin for the resources of one section of a claim.
          A claim controller writes the spec, and the plugin controller that serves
          the registration writes the status. The claim names a request
          <claim>-<section>.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of PluginRequest
            properties:
              claimRef:
                description: |-
                  ClaimRef names the claim that wrote the request. It cannot change
                  after the request is created.
                properties:
                  kind:
                    description: Kind is the kind of the claim.
                    enum:
                    - CamundaClusterClaim
                    - CamundaManagementClusterClaim
                    type: string
                  name:
                    description: Name is the name of the claim, in the namespace of
                      the request.
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                type: object
                x-kubernetes-validations:
                - message: 'claimRef is immutable: delete the request and create a
                    new one'
                  rule: self == oldSelf
              deletionPolicy:
                description: |-
                  DeletionPolicy says what the plugin does with the resources of the
                  request when the request is deleted. The claim controller copies it
                  from the claim before it deletes the request.
                enum:
                - Delete
                - Orphan
                type: string
              inputs:
                additionalProperties:
                  type: string
                description: |-
                  Inputs are the values of the inputs of the registration, by input
                  name. The claim controller resolves them from the outputs of other
                  requests of the same claim.
                type: object
              parameters:
                description: |-
                  Parameters are the settings of the request, as free-form JSON. The
                  plugin checks them against the parameter schema of the registration.
                x-kubernetes-preserve-unknown-fields: true
              registration:
                description: |-
                  Registration is the name of the PluginRegistration that serves the
                  request. It cannot change after the request is created.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: 'registration is immutable: delete the request and create
                    a new one'
                  rule: self == oldSelf
              section:
                description: |-
                  Section is the name of the PluginSection that the request fills. It
                  cannot change after the request is created.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: 'section is immutable: delete the request and create a
                    new one'
                  rule: self == oldSelf
              target:
                description: |-
                  Target names the resource that the request serves, before the
                  resource exists. target.name cannot change after the request is
                  created.
                properties:
                  additionalServiceAccounts:
                    description: |-
                      AdditionalServiceAccounts are the names of more ServiceAccounts that
                      the cloud identity of the request also trusts. Examples are the
                      ServiceAccounts of the built-in storage that takes the backup storage
                      input. Each name is a ServiceAccount in the namespace of the request. A name with a namespace part is refused,
                      so that a request never makes a cloud identity trust a ServiceAccount
                      of another namespace.
                    items:
                      maxLength: 253
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                    type: array
                  kind:
                    description: Kind is the kind of the resource, for example CamundaCluster.
                    minLength: 1
                    type: string
                  name:
                    description: Name is the name of the resource, in the namespace
                      of the request.
                    minLength: 1
                    type: string
                  serviceAccountName:
                    description: |-
                      ServiceAccountName is the ServiceAccount that the pods of the resource
                      run under.
                    type: string
                required:
                - kind
                - name
                type: object
                x-kubernetes-validations:
                - message: 'target.name is immutable: delete the request and create
                    a new one'
                  rule: self.name == oldSelf.name
            required:
            - claimRef
            - deletionPolicy
            - registration
            - section
            - target
            type: object
          status:
            description: status defines the observed state of PluginRequest
            properties:
              conditions:
                description: |-
                  Conditions are OutputsReady and Ready. OutputsReady is True when the
                  outputs are written for the current generation. Ready is False with
                  reason GrantRejected while a Grant of the request is not Ready. Ready
                  is False with reason WaitingForEndpoints while an access request waits
                  for the endpoints of its target. Ready is False with reason
                  InvalidParameters when the parameters do not pass the registration.
                  The plugin sets the other reasons.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              links:
                description: |-
                  Links are named URLs about the request, for example the console page
                  of a bucket, for display only.
                items:
                  description: |-
                    Link is a named URL that a plugin reports for a request, for example the
                    console page of a bucket.
                  properties:
                    name:
                      description: Name names the link.
                      minLength: 1
                      type: string
                    url:
                      description: URL is the address of the link.
                      minLength: 1
                      type: string
                  required:
                  - name
                  - url
                  type: object
                type: array
              observedGeneration:
                description: |-
                  ObservedGeneration is the generation of the spec that the plugin
                  processed last.
                format: int64
                type: integer
              outputs:
                additionalProperties:
                  type: string
                description: |-
                  Outputs are the values that the plugin publishes for the request, by
                  output key. A reader trusts them only while OutputsReady is True and
                  the observedGeneration of that condition equals metadata.generation.
                type: object
              podSelector:
                description: |-
                  PodSelector selects the pods that the plugin runs for the request, for
                  display only.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              resources:
                description: |-
                  Resources are the resources that the plugin made for the request, in
                  the cluster or in a cloud, for display only.
                items:
                  description: |-
                    ResourceRef is one resource that a plugin made for a request, in the
                    cluster or in a cloud.
                  properties:
                    id:
                      description: ID is the identifier of the resource in its system,
                        for example an ARN.
                      type: string
                    kind:
                      description: Kind is the kind of the resource, for example S3Bucket
                        or StorageClass.
                      minLength: 1
                      type: string
                    location:
                      description: Location is where the resource is, for example
                        a cloud region.
                      type: string
                    name:
                      description: Name is the name of the resource.
                      minLength: 1
                      type: string
                    onOrphan:
                      description: |-
                        OnOrphan says what happens to the resource with the deletion policy
                        Orphan.
                      enum:
                      - Kept
                      - Deleted
                      type: string
                    role:
                      description: Role says what the resource does for the request.
                      type: string
                  required:
                  - kind
                  - name
                  - onOrphan
                  type: object
                type: array
              summary:
                description: |-
                  Summary is a list of facts about the request, for display only. No
                  controller reads it. The first item is the headline.
                items:
                  description: SummaryItem is one fact that a plugin reports about
                    a request.
                  properties:
                    label:
                      description: Label names the fact.
                      minLength: 1
                      type: string
                    severity:
                      default: Info
                      description: |-
                        Severity is the weight of the fact. The fleet manager lists Warning
                        and Error items as warnings.
                      enum:
                      - Info
                      - Warning
                      - Error
                      type: string
                    value:
                      description: Value is the value of the fact.
                      type: string
                  required:
                  - label
                  - value
                  type: object
                type: array
              summaryTime:
                description: |-
                  SummaryTime is when the plugin wrote the summary last, for display
                  only.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: metadata.name must be at most 63 characters, because it is used
            as a label value
          rule: self.metadata.name.size() <= 63
    served: true
    storage: true
    subresources:
      status: {}
