---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: backupschedules.core.camunda.io
spec:
  group: core.camunda.io
  names:
    kind: BackupSchedule
    listKind: BackupScheduleList
    plural: backupschedules
    singular: backupschedule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    - jsonPath: .spec.clusterRef.name
      name: Cluster
      priority: 1
      type: string
    - jsonPath: .status.lastScheduleTime
      name: Last schedule
      priority: 1
      type: date
    - jsonPath: .status.lastBackupName
      name: Last backup
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          BackupSchedule creates logical backups of one CamundaCluster on a cron
          schedule, and deletes old backups that have its label. At each trigger, the
          operator creates the backup kind for the storage type of the cluster. The
          backup has the name <schedule>-<unix-timestamp> and the labels
          camunda.io/cluster and camunda.io/backup-schedule. If a name is too long
          for a resource name or a label value, the operator shortens it. Then it
          adds a hash of the full name, so two long names stay different.

          The backups have no owner reference to the schedule, so a deletion of the
          schedule never deletes its backups. The schedule skips a trigger while a
          reference does not resolve, and the Ready condition shows the reason. It
          also skips a trigger while the cluster is suspended or cannot start a
          backup yet. It skips a trigger too while a backup of this schedule is not
          in a final phase. It records an event for these three skips, and no event
          for a reference that does not resolve.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of BackupSchedule
            properties:
              clusterRef:
                description: |-
                  ClusterRef references the CamundaCluster to back up. At each trigger,
                  the operator creates the backup kind for the storage type of the
                  cluster: LogicalBackupElasticsearch or LogicalBackupRDBMS.
                properties:
                  name:
                    description: |-
                      Name is the name of the CamundaCluster, in the namespace of this
                      object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              retained:
                default: {}
                description: |-
                  Retained limits how many backups of this schedule stay. The schedule
                  counts and deletes the backups in its namespace whose
                  camunda.io/backup-schedule label names this schedule. A backup that you
                  create with that label counts too, and the schedule can delete it. The
                  schedule never deletes a backup that is not in a final phase.
                properties:
                  completed:
                    default: 7
                    description: Completed is how many completed backups the schedule
                      keeps.
                    format: int32
                    minimum: 1
                    type: integer
                  failed:
                    default: 3
                    description: |-
                      Failed is how many failed backups the schedule keeps. With zero, the
                      operator deletes a failed backup soon after it fails.
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              schedule:
                description: |-
                  Schedule is when the backups run: a five-field cron expression
                  (minute, hour, day of month, month, day of week), evaluated in UTC.
                pattern: ^\s*([0-9A-Za-z*?,/-]+\s+){4}[0-9A-Za-z*?,/-]+\s*$
                type: string
            required:
            - clusterRef
            - schedule
            type: object
          status:
            description: status defines the observed state of BackupSchedule
            properties:
              conditions:
                description: |-
                  Conditions represent the current state. The Ready condition has the
                  reason Healthy while the schedule can run its backups, and
                  InvalidReference while a reference does not resolve.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastBackupName:
                description: LastBackupName is the backup that the schedule created
                  most recently.
                type: string
              lastScheduleTime:
                description: |-
                  LastScheduleTime is the last trigger that the schedule used, also when
                  it skipped the trigger. The schedule never tries a skipped trigger
                  again.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the last generation that the operator
                  processed.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
