---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: logicalrestoreelasticsearches.core.camunda.io
spec:
  group: core.camunda.io
  names:
    kind: LogicalRestoreElasticsearch
    listKind: LogicalRestoreElasticsearchList
    plural: logicalrestoreelasticsearches
    shortNames:
    - lres
    singular: logicalrestoreelasticsearch
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.backupRef.name
      name: Backup
      type: string
    - jsonPath: .spec.targetClusterRef.name
      name: Target
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          LogicalRestoreElasticsearch restores one completed
          LogicalBackupElasticsearch into one suspended CamundaCluster. It deletes
          the Camunda indices of the target and restores every snapshot of the backup
          into its Elasticsearch. Then it gives the brokers empty data volumes and
          runs the Camunda restore application one time for each broker.

          The restore prepares the target itself. It suspends the target, waits for
          its brokers to stop, and sets spec.version to the Camunda version of the
          backup. When it completes, it removes the suspension, but only a
          suspension that it applied itself. A failed restore leaves the target
          suspended. A restore that somebody deletes while it runs also leaves the
          target suspended. Empty or half-written broker volumes cause more damage
          under running brokers.

          The restore keeps spec.version, with the field manager
          camunda-operator/restore-version. The target runs the version of the
          backup until another manager takes over or removes that field. A manifest
          without spec.version does not change it, because server-side apply
          removes a field only for the manager that set it. This applies also to a
          target that gets its version from a release. The value of the restore wins
          over the release until somebody removes the field.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              spec names the backup to restore and the cluster to restore into. It
              is immutable. A restore runs one time. To try again, create a new
              resource.
            properties:
              backupRef:
                description: |-
                  BackupRef references the completed LogicalBackupElasticsearch to
                  restore from, in the namespace of this restore.
                properties:
                  name:
                    description: Name is the name of the backup, in the namespace
                      of this restore.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              targetClusterRef:
                description: |-
                  TargetClusterRef references the CamundaCluster to restore into. It
                  must name the cluster of the backup, because the restore application
                  reads the primary-storage backup under the prefix of that cluster. The
                  cluster must stay suspended for the whole restore.
                properties:
                  name:
                    description: |-
                      Name is the name of the CamundaCluster, in the namespace of this
                      object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - backupRef
            - targetClusterRef
            type: object
            x-kubernetes-validations:
            - message: 'spec is immutable: a restore is one-shot, retried by creating
                a new resource'
              rule: self == oldSelf
          status:
            description: status defines the observed state of the restore
            properties:
              backend:
                description: |-
                  Backend is the Elasticsearch that the restore writes, as the scheme,
                  the host, and the port. The operator records it when the restore
                  starts. From then until the final phase, and after it while
                  recoveryHeld is true, no other CamundaCluster starts on this backend.
                  The restore waits while its target does not hold the backend.
                type: string
              backupId:
                description: |-
                  BackupID is the backup that the restore reads. The operator records it
                  when the restore starts. Later phases of the restore still read the
                  backup resource, so keep it until the restore completes.
                format: int64
                type: integer
              brokers:
                description: |-
                  Brokers is the broker count of the broker StatefulSet. The operator
                  records it before the restore deletes a volume. It sets how many
                  volumes the restore creates again and how many Jobs run.
                format: int32
                type: integer
              clusterSuspended:
                description: |-
                  ClusterSuspended records that this restore suspended its target
                  cluster. The restore removes that suspension when it reaches
                  Completed. A cluster that its owner suspended has no such record, so
                  it stays suspended. The cluster of a failed restore also stays
                  suspended.
                type: boolean
              completionTime:
                description: CompletionTime is when the restore reached a final phase.
                format: date-time
                type: string
              conditions:
                description: Conditions represent the current state of the restore.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              contract:
                description: |-
                  Contract is the SecondaryStorageConfig that held the endpoint of
                  Backend when the restore started. When the endpoint of that contract
                  moves, the restore still holds this contract.
                type: string
              failureMessage:
                description: |-
                  FailureMessage names the failed phase and its error. The Ready
                  condition has the same message.
                type: string
              firstFailedAt:
                description: |-
                  FirstFailedAt is when a dependency of the running restore first stopped
                  resolving. The grace period starts at this time. The field can clear if
                  the dependency recovers before the restore deletes target indices or
                  records a recreated broker volume or a broker Job. After that point, the
                  field stays set, so a dependency that fails and recovers again and
                  again does not reset the grace period.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the last generation that the operator
                  processed.
                format: int64
                type: integer
              phase:
                description: |-
                  Phase is the phase of the restore. After an interruption, the restore
                  continues at this phase.
                enum:
                - Pending
                - ValidatingCompatibility
                - RestoringSecondaryStorage
                - RestoringPrimaryStorage
                - Completed
                - Failed
                type: string
              primaryJobNames:
                description: |-
                  PrimaryJobNames are the restore application Jobs, one for each broker,
                  in broker order. The operator records them before it creates the Jobs.
                  A completed restore removes these Jobs. The logs of these Jobs explain
                  a failed restore.
                items:
                  type: string
                type: array
              recoveryHeld:
                description: |-
                  RecoveryHeld is true while a failed or deleted restore keeps the
                  backend, because Elasticsearch can still recover snapshots that the
                  restore asked for. While it is true, no other CamundaCluster starts on
                  the backend, and the target stays suspended. No other backup or restore
                  of the target starts. A deleted restore stays while it is true. It is
                  unset on a restore that was never held, and false when the hold ends.
                type: boolean
              recoveryUnknownSince:
                description: |-
                  RecoveryUnknownSince is the start of the current period in which a held
                  restore cannot read the recovery from Elasticsearch. If the recovery stays unknown for ten
                  minutes, the restore releases the backend.
                format: date-time
                type: string
              recreatedClaims:
                description: |-
                  RecreatedClaims names the broker data claims that the restore deleted
                  and created again. Thus the restore does not delete a claim two times.
                items:
                  type: string
                type: array
              repository:
                description: |-
                  Repository is the Elasticsearch snapshot repository that the restore
                  reads from, on the Elasticsearch of the target.
                type: string
              restoredSnapshots:
                description: |-
                  RestoredSnapshots names every snapshot that the restore asked
                  Elasticsearch to restore. After the operator records the names, the
                  restore does not delete the indices again when it continues after an
                  interruption.
                items:
                  type: string
                type: array
              targetClusterUID:
                description: |-
                  TargetClusterUID records the identity of the target cluster. A cluster
                  that is deleted and created again with the same name is another
                  cluster, and this restore does not apply to it.
                type: string
              terminalReason:
                description: |-
                  TerminalReason is the Ready reason that the operator recorded when the
                  restore reached its final phase.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
