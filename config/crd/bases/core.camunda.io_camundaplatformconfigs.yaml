---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: camundaplatformconfigs.core.camunda.io
spec:
  group: core.camunda.io
  names:
    kind: CamundaPlatformConfig
    listKind: CamundaPlatformConfigList
    plural: camundaplatformconfigs
    singular: camundaplatformconfig
  scope: Cluster
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: |-
          CamundaPlatformConfig is the cluster-scoped CRD that holds the
          environment-wide platform settings — identity provider, license, and image
          registry — that every orchestration cluster referencing it shares.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of CamundaPlatformConfig
            properties:
              auth:
                description: |-
                  Auth holds the authentication settings of the orchestration clusters.
                  Unset means basic authentication.
                properties:
                  method:
                    default: basic
                    description: |-
                      Method is the authentication method. An unset auth block and an unset
                      method both mean basic.
                    enum:
                    - basic
                    - oidc
                    type: string
                  oidc:
                    description: |-
                      OIDC is the identity provider connection. Required when method is oidc,
                      forbidden otherwise.
                    properties:
                      audience:
                        description: |-
                          Audience is the audience that consumers validate in access tokens.
                          Consumers default it to ClientID when empty.
                        type: string
                      authUrl:
                        description: |-
                          AuthURL is an explicit authorization endpoint. It overrides the value
                          from OIDC discovery.
                        type: string
                        x-kubernetes-validations:
                        - message: authUrl must be empty or a valid http or https
                            URL
                          rule: self == '' || (isURL(self) && (url(self).getScheme()
                            == 'http' || url(self).getScheme() == 'https'))
                      clientId:
                        description: |-
                          ClientID is the default OIDC client ID that all clusters share unless a
                          preset or a cluster overrides it.
                        minLength: 1
                        type: string
                      clientIdClaim:
                        description: |-
                          ClientIDClaim is the token claim that holds the id of a machine client.
                          Empty means that no claim identifies a client, and every token becomes a
                          person. The claim must be absent from the tokens of persons, because a
                          token that carries it always becomes a client.
                        type: string
                      clientSecretRef:
                        description: |-
                          ClientSecretRef names the Secret key that holds the default OIDC client
                          secret.
                        properties:
                          key:
                            description: Key in the Secret holding the value.
                            minLength: 1
                            type: string
                          name:
                            description: Name of the Secret holding the value.
                            minLength: 1
                            type: string
                          namespace:
                            description: Namespace of the Secret.
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        - namespace
                        type: object
                      issuerUrl:
                        description: |-
                          IssuerURL is the issuer URL of the identity provider. Consumers resolve
                          the endpoints from its OIDC discovery document unless the explicit
                          endpoint fields override them.
                        type: string
                        x-kubernetes-validations:
                        - message: issuerUrl must be a valid http or https URL
                          rule: isURL(self) && (url(self).getScheme() == 'http' ||
                            url(self).getScheme() == 'https')
                      jwksUrl:
                        description: |-
                          JWKSURL is an explicit JWKS endpoint. It overrides the value from OIDC
                          discovery.
                        type: string
                        x-kubernetes-validations:
                        - message: jwksUrl must be empty or a valid http or https
                            URL
                          rule: self == '' || (isURL(self) && (url(self).getScheme()
                            == 'http' || url(self).getScheme() == 'https'))
                      tokenUrl:
                        description: |-
                          TokenURL is an explicit token endpoint. It overrides the value from OIDC
                          discovery.
                        type: string
                        x-kubernetes-validations:
                        - message: tokenUrl must be empty or a valid http or https
                            URL
                          rule: self == '' || (isURL(self) && (url(self).getScheme()
                            == 'http' || url(self).getScheme() == 'https'))
                      usernameClaim:
                        description: |-
                          UsernameClaim is the token claim that holds the username of a person.
                          Empty means the default of the orchestration cluster, which is "sub".
                        type: string
                    required:
                    - clientId
                    - clientSecretRef
                    - issuerUrl
                    type: object
                type: object
                x-kubernetes-validations:
                - message: oidc is required when method is oidc and must not be set
                    when method is basic
                  rule: (self.method == 'oidc') == has(self.oidc)
              imageRegistry:
                description: |-
                  ImageRegistry is the registry prefix of all Camunda component images.
                  Empty means the upstream Camunda registry.
                type: string
              licenseSecretRef:
                description: |-
                  LicenseSecretRef names the Secret key that holds the Camunda license
                  key. Without it, clusters run in unlicensed non-production mode.
                properties:
                  key:
                    description: Key in the Secret holding the value.
                    minLength: 1
                    type: string
                  name:
                    description: Name of the Secret holding the value.
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace of the Secret.
                    minLength: 1
                    type: string
                required:
                - key
                - name
                - namespace
                type: object
            type: object
          status:
            description: status defines the observed state of CamundaPlatformConfig
            properties:
              conditions:
                description: |-
                  Conditions represent the current validation state; the Ready condition
                  carries reasons Healthy or MissingSecret.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the last generation reconciled
                  by the operator.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
