# This rule is not used by the project camunda-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to plugins.camunda.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: camunda-operator
    app.kubernetes.io/managed-by: kustomize
  name: plugins-pluginsection-viewer-role
rules:
- apiGroups:
  - plugins.camunda.io
  resources:
  - pluginsections
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - plugins.camunda.io
  resources:
  - pluginsections/status
  verbs:
  - get
