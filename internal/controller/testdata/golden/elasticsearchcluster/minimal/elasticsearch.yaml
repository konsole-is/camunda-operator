apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  labels:
    camunda.io/cluster: my-cluster-es
    camunda.io/component: elasticsearch
  name: my-cluster-es
  namespace: my-cluster-ns
spec:
  auth:
    fileRealm:
    - secretName: my-cluster-es-es-user
  http:
    service:
      metadata: {}
      spec: {}
    tls:
      certificate: {}
      client: {}
  monitoring:
    logs: {}
    metrics: {}
  nodeSets:
  - count: 3
    name: default
    podTemplate:
      metadata:
        labels:
          camunda.io/cluster: my-cluster-es
          camunda.io/component: elasticsearch
      spec:
        containers: null
    volumeClaimTemplates:
    - metadata:
        labels:
          camunda.io/cluster: my-cluster-es
          camunda.io/component: elasticsearch
        name: elasticsearch-data
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 64Gi
      status: {}
  remoteClusterServer:
    service:
      metadata: {}
      spec: {}
  transport:
    service:
      metadata: {}
      spec: {}
    tls:
      certificate: {}
      certificateAuthorities: {}
  updateStrategy:
    changeBudget: {}
  version: 9.2.4
status:
  conditions: null
  inProgressOperations:
    downscale:
      lastUpdatedTime: null
    upgrade:
      lastUpdatedTime: null
    upscale:
      lastUpdatedTime: null
