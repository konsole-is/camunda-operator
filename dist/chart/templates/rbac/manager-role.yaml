apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "camunda-operator.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - core.camunda.io
  resources:
  - backupretentions
  - backups
  - backupschedules
  - camundaclusters
  - camundamanagementclusters
  - camundaoptimizes
  - camundaplatformconfigs
  - databaseconfigs
  - databases
  - databaseserverconfigs
  - elasticsearchclusters
  - logicalrestores
  - managementauthconfigs
  - objectstorageconfigs
  - pointintimerestores
  - pvcautoresizes
  - secondarystorageconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - core.camunda.io
  resources:
  - backupretentions/finalizers
  - backups/finalizers
  - backupschedules/finalizers
  - camundaclusters/finalizers
  - camundamanagementclusters/finalizers
  - camundaoptimizes/finalizers
  - camundaplatformconfigs/finalizers
  - databaseconfigs/finalizers
  - databases/finalizers
  - databaseserverconfigs/finalizers
  - elasticsearchclusters/finalizers
  - logicalrestores/finalizers
  - managementauthconfigs/finalizers
  - objectstorageconfigs/finalizers
  - pointintimerestores/finalizers
  - pvcautoresizes/finalizers
  - secondarystorageconfigs/finalizers
  verbs:
  - update
- apiGroups:
  - core.camunda.io
  resources:
  - backupretentions/status
  - backups/status
  - backupschedules/status
  - camundaclusters/status
  - camundamanagementclusters/status
  - camundaoptimizes/status
  - camundaplatformconfigs/status
  - databaseconfigs/status
  - databases/status
  - databaseserverconfigs/status
  - elasticsearchclusters/status
  - logicalrestores/status
  - managementauthconfigs/status
  - objectstorageconfigs/status
  - pointintimerestores/status
  - pvcautoresizes/status
  - secondarystorageconfigs/status
  verbs:
  - get
  - patch
  - update
