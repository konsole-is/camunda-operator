{{- if .Values.rbacHelpers.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "camunda-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "camunda-operator.resourceName" (dict "suffix" "objectstorageconfig-admin-role" "context" $) }}
rules:
- apiGroups:
  - core.camunda.io
  resources:
  - objectstorageconfigs
  verbs:
  - '*'
- apiGroups:
  - core.camunda.io
  resources:
  - objectstorageconfigs/status
  verbs:
  - get
{{- end }}
