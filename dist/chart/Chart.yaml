apiVersion: v2
name: camunda-operator
description: Core Kubernetes operator for the Camunda platform
type: application

# version, appVersion, and the image tags in artifacthub.io/images are
# placeholders. The release workflow (.github/workflows/release.yml) rewrites
# them with the release tag. Keep version and appVersion anchored at the start
# of a line, because the sed expressions depend on it.
version: 0.0.1
appVersion: "0.0.1"

kubeVersion: ">= 1.34.0-0"

keywords:
  - kubernetes
  - operator
  - camunda

home: https://github.com/konsole-is/camunda-operator
sources:
  - https://github.com/konsole-is/camunda-operator
icon: https://avatars.githubusercontent.com/u/200405113?v=4

maintainers:
  - name: konsole-is
    url: https://github.com/konsole-is

annotations:
  kubebuilder.io/generated-by: kubebuilder
  artifacthub.io/operator: "true"
  artifacthub.io/operatorCapabilities: Full Lifecycle
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/konsole-is/camunda-operator/tree/main/docs
    - name: support
      url: https://github.com/konsole-is/camunda-operator/issues
  artifacthub.io/images: |
    - name: manager
      image: ghcr.io/konsole-is/camunda-operator:0.0.1
    - name: cli
      image: ghcr.io/konsole-is/camunda-operator-cli:0.0.1
